      }, [history, calEvents, bopEvents, bopGuests, settings.advisorName, welcomeNonce]);

      const pendingCount = outbox.length;
      const canEditAmounts = !!form.casePaid && canEditOutcome;

      return (
        <Page>
          <TopBar settingsOpen={openSettings} onToggleSettings={() => {
            pauseTimer();                       // PAUSE on Settings
            setOpenSettings(v => !v);
          }} onShowWelcome={() => {
            // Re-open the welcome on demand, with fresh content, from any tab.
            if (openSettings) setOpenSettings(false);
            setTab("log");
            setWelcomeNonce(n => n + 1);
            setWelcomeDismissed(false);
          }} pendingCount={pendingCount} weeklyGoalSlots={weeklyGoalSlots} />

          {/* Phase 2: gentle nudge to reconcile past-due scheduled meetings. */}
          {!openSettings && pastDueMeetings.length > 0 && (
            <div className="mb-3 flex items-center justify-between gap-3 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2.5">
              <div className="flex items-center gap-2 text-sm text-amber-800">
                <span aria-hidden="true">⚠️</span>
                <span>
                  <span className="font-semibold">{pastDueMeetings.length}</span> past {pastDueMeetings.length === 1 ? "appointment needs" : "appointments need"} updating
                </span>
              </div>
              <button type="button" onClick={() => setReviewing(true)}
                className="shrink-0 rounded-md bg-amber-600 px-3 py-1.5 text-xs font-semibold text-white shadow-sm [@media(hover:hover)]:hover:bg-amber-700 active:scale-95 transition">
                Review
              </button>
            </div>
          )}

          {/* Phase 2: review overlay — step through each past-due meeting. */}
          {reviewing && pastDueMeetings.length > 0 && (() => {
            const m = pastDueMeetings[0];
            const remaining = pastDueMeetings.length;
            const fmtWhen = (r) => {
              const d = new Date(`${r.date}T${r.appointmentTime || "00:00"}`);
              return isNaN(d)
                ? (r.date || "")
                : d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })
                  + (r.appointmentTime ? ` · ${r.appointmentTime}` : "");
            };
            return (
              <div className="fixed inset-0 z-[60] flex items-end justify-center bg-black/40 p-4 sm:items-center" onClick={() => setReviewing(false)}>
                <div className="w-full max-w-sm rounded-xl bg-white p-4 shadow-xl" onClick={(e) => e.stopPropagation()}>
                  <div className="mb-1 flex items-center justify-between">
                    <div className="text-sm font-semibold text-neutral-900">Update past appointment</div>
                    <span className="text-xs text-neutral-400">{remaining} left</span>
                  </div>
                  <div className="rounded-lg border border-neutral-200 bg-neutral-50 px-3 py-2.5">
                    <div className="truncate text-sm font-semibold text-neutral-900">{m.prospect || "Meeting"}</div>
                    <div className="mt-0.5 text-xs text-neutral-500">
                      {fmtWhen(m)}{m.meetingPlace ? ` · ${m.meetingPlace}` : ""}
                    </div>
                  </div>
                  <p className="mt-3 text-xs text-neutral-500">Did this meeting happen?</p>
                  <div className="mt-2 grid gap-2">
                    <button type="button" onClick={() => reviewInForm(m)}
                      className="flex items-center justify-center gap-2 rounded-md bg-emerald-600 px-3 py-2.5 text-sm font-semibold text-white [@media(hover:hover)]:hover:bg-emerald-700 active:scale-[0.98] transition">
                      ✅ It happened — fill in results
                    </button>
                    <button type="button" onClick={() => reviewInForm(m)}
                      className={cls(btnSecondary, "justify-center")}>
                      🔄 Rescheduled — change date/time/venue
                    </button>
                    <button type="button" onClick={() => markMeetingStatus(m, "missed")}
                      className={cls(btnSecondary, "justify-center text-rose-600")}>
                      ✖️ Didn't happen (missed)
                    </button>
                  </div>
                  <button type="button" onClick={() => setReviewing(false)}
                    className="mt-3 w-full py-1.5 text-center text-xs font-medium text-neutral-400 [@media(hover:hover)]:hover:text-neutral-600">
                    I'll do this later
                  </button>
                </div>
              </div>
            );
          })()}

          <Slide open={openSettings}>
            <Section title="SETTINGS">
              <div className="grid gap-4">
                {/* 1) Basic settings */}
                <LabeledInput label="Your Name (Advisor)">
                  <TextInput
                    value={settings.advisorName}
                    onChange={v => setSettings(s => ({ ...s, advisorName: v }))}
                    placeholder="e.g., Jimmy"
                  />
                </LabeledInput>
          
                <LabeledInput label="Unit *">
                  <Select
                    value={settings.unit}
                    onChange={v => setSettings(s => ({ ...s, unit: v }))}
                    options={UNIT_OPTIONS}
                    placeholder="-- Select Unit --"
                  />
                </LabeledInput>
          
                <LabeledInput label="Sync Key">
                  <TextInput
                    value={settings.syncKey}
                    onChange={v => setSettings(s => ({ ...s, syncKey: v }))}
                    placeholder="Paste the key from admin"
                  />
                </LabeledInput>

                <fieldset>
                  <legend className="mb-2 text-sm font-semibold text-neutral-700">App colors</legend>
                  <div className="grid grid-cols-3 gap-2" role="radiogroup" aria-label="App color theme">
                    {THEME_OPTIONS.map(option => {
                      const selected = settings.theme === option.value;
                      return (
                        <button key={option.value} type="button" role="radio" aria-checked={selected}
                          className="theme-choice rounded-lg border border-neutral-300 bg-white p-2 text-left shadow-sm"
                          onClick={() => setSettings(s => ({ ...s, theme: option.value }))}>
                          <span className="mb-2 flex overflow-hidden rounded-md border border-black/10" aria-hidden="true">
                            {option.colors.map(color => <span key={color} className="h-5 flex-1" style={{backgroundColor:color}} />)}
                          </span>
                          <span className="flex items-center justify-between gap-1 text-xs font-semibold text-neutral-800">
                            {option.label}<span aria-hidden="true">{selected ? "✓" : ""}</span>
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </fieldset>

                {/* 2) Sync area */}
                <div className="rounded-lg border border-neutral-200 bg-neutral-50 p-3">
                  <div className="flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <div className="text-sm font-semibold text-neutral-700">Sync</div>
                      <div className="text-xs text-neutral-600 truncate">
                        Last sync: {lastSyncAt ? new Date(lastSyncAt).toLocaleString() : "Never"}
                      </div>
                    </div>

                  <button
                    type="button"
                    onClick={() => pullUpdates({ quietIfNone: false })}
                    disabled={!settings.advisorName || !settings.syncKey}
                    className={cls(
                      btnPrimary,
                      (!settings.advisorName || !settings.syncKey) && "opacity-50 cursor-not-allowed pointer-events-none"
                    )}
                    title={
                      !settings.advisorName || !settings.syncKey
                        ? "Enter Advisor Name and Sync Key first"
                        : "Pull admin updates now"
                    }
                  >
                    Sync now
                  </button>

                  </div>
                  {/* Advanced tools (collapsed by default) */}
                  <button
                    type="button"
                    onClick={() => setShowAdvanced(v => !v)}
                    className="mt-3 text-xs text-slate-600 underline"
                  >
                    {showAdvanced ? "Hide advanced" : "Advanced…"}
                  </button>
          
                  {showAdvanced && (
                    <div className="mt-3 grid gap-2">
                      <button
                        type="button"
                        onClick={clearHistoryAndOutbox}
                        className={btnDestructive}
                      >
                        🧹 Clear on This Phone
                      </button>
          
                      <button
                        type="button"
                        onClick={forceFullSync}
                        disabled={!settings.advisorName || !settings.syncKey}
                        className={btnSecondary}
                      >
                        🔄 Get a Fresh Copy
                      </button>

                      <button
                        type="button"
                        onClick={nukeEverything}
                        className={btnDestructive}
                      >
                         ↺ Reset App on Phone
                      </button>
          
                      <div className="mt-1 space-y-1 text-[11px] leading-snug text-slate-500">
                        <div>
                          <span className="font-semibold">🧹 Clear on This Phone </span>
                          — removes the meeting list and outbox on this device only. Your name, unit, and sync key stay saved.
                        </div>
                        <div>
                          <span className="font-semibold">🔄 Get a Fresh Copy </span>
                          — re-downloads all your entries from the server and merges them. Safe anytime (e.g., after a cleanup or new phone).
                        </div>
                        <div>
                          <span className="font-semibold">↺ Reset App on Phone </span>
                          — resets this app’s saved data on this device only. Server records stay unchanged; you’ll enter your details next time.
                        </div>
                      </div>
                    </div>
                  )}
                </div>
          
                {/* 3) Close */}
                <div className="flex justify-end">
                  <button
                    type="button"
                    className={btnSecondary}
                    onClick={() => setOpenSettings(false)}
                  >
                    Done
                  </button>
                </div>
              </div>
            </Section>
          </Slide>

          {tab==="log" && (
            <>
              {welcomeReady && !welcomeDismissed && (
                <section className="mb-4 overflow-hidden rounded-lg border border-indigo-200 bg-gradient-to-br from-indigo-600 to-violet-600 p-4 text-white shadow-sm">
                  <div className="flex items-start justify-between gap-2">
                    <h2 className="text-lg font-bold leading-tight">
                      {welcomeData.greeting}{welcomeData.firstName ? `, ${welcomeData.firstName}` : ""}! 👋
                    </h2>
                    <button
                      onClick={() => setWelcomeDismissed(true)}
                      aria-label="Dismiss welcome"
                      className="-mr-1 -mt-1 rounded-md p-1 text-white/70 transition hover:bg-white/15 hover:text-white"
                    >
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                  </div>

                  <p className="mt-1 text-sm font-medium text-white/95">{welcomeData.pace}</p>
                  <p className="mt-2 text-base font-extrabold leading-snug">{welcomeData.hype}</p>

                  <div className="mt-3 rounded-md bg-white/15 p-3">
                    <div className="text-[11px] font-semibold uppercase tracking-wide text-white/70">Next up</div>
                    <p className="mt-0.5 text-sm font-medium">{welcomeData.action.text}</p>
                    {welcomeData.action.dest && (
                      <button
                        onClick={() => goToTab(welcomeData.action.dest)}
                        className="mt-2 inline-flex items-center gap-1 rounded-md bg-white px-3 py-1.5 text-xs font-bold text-indigo-700 shadow-sm transition hover:bg-white/90"
                      >
                        {welcomeData.action.cta} →
                      </button>
                    )}
                  </div>

                  {(welcomeData.stats.mtdMeetings > 0 || welcomeData.stats.convRate != null) && (
                    <div className="mt-3 grid grid-cols-3 gap-2 border-t border-white/20 pt-3">
                      <div className="text-center">
                        <div className="text-lg font-bold tabular-nums">{welcomeData.stats.mtdMeetings}</div>
                        <div className="text-[10px] uppercase tracking-wide text-white/70">This month</div>
                      </div>
                      <div className="text-center">
                        <div className="text-lg font-bold tabular-nums">{welcomeData.stats.ytdMeetings}</div>
                        <div className="text-[10px] uppercase tracking-wide text-white/70">This year</div>
                      </div>
                      <div className="text-center">
                        <div className="text-lg font-bold tabular-nums">{welcomeData.stats.convRate == null ? "—" : `${welcomeData.stats.convRate}%`}</div>
                        <div className="text-[10px] uppercase tracking-wide text-white/70">Meet→Paid</div>
                      </div>
                    </div>
                  )}

                  {welcomeData.bestDayLabel && (
                    <p className="mt-3 text-[13px] text-white/90">
                      <span className="font-semibold">Worth knowing:</span> {welcomeData.bestDayLabel} tend to be your strongest for closing. Worth booking a few there.
                    </p>
                  )}

                  {welcomeData.upcomingMeetings.length > 0 && (
                    <div className="mt-3 border-t border-white/20 pt-3 text-[13px] text-white/90">
                      <p className="font-semibold">
                        {welcomeData.upcomingMeetings.length} client meeting{welcomeData.upcomingMeetings.length > 1 ? "s" : ""} ahead in the next 7 days:
                      </p>
                      <ul className="mt-1 space-y-0.5">
                        {welcomeData.upcomingMeetings.map((m, i) => (
                          <li key={i}>📅 {m.day}: {m.name}{m.time ? ` at ${m.time}` : ""}</li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {(welcomeData.sessionSummary.length > 0 || welcomeData.bopAhead.length > 0) && (
                    <div className="mt-3 space-y-1 border-t border-white/20 pt-3 text-[13px] text-white/90">
                      {welcomeData.sessionSummary.length > 0 && (
                        <p><span className="font-semibold">Next 7 days:</span> {welcomeData.sessionSummary.join(" · ")}</p>
                      )}
                      {welcomeData.bopAhead.map((b, i) => (
                        <p key={i}>
                          <span className="font-semibold">📣 {b.name}</span> on {b.day}
                          {b.guests > 0
                            ? `. ${b.guests} guest${b.guests > 1 ? "s" : ""} registered, and a reminder call helps them show up.`
                            : `. No guests registered yet.`}
                        </p>
                      ))}
                    </div>
                  )}

                  <p className="mt-3 border-t border-white/20 pt-3 text-[13px] italic text-white/85">{welcomeData.tip}</p>
                </section>
              )}
              <Section
                title={monthYearLabel}
                right={
                  bbStats.loading ? (
                    <span className="text-xs font-medium text-slate-500">Loading…</span>
                  ) : null
                }
              >
                {bbStats.error ? (
                  <div className="text-sm text-rose-600">Couldn't load: {bbStats.error}</div>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    <div className="rounded-md bg-neutral-100 p-3 text-center">
                      <div className="text-[11px] font-semibold uppercase tracking-wide text-neutral-500">FYC</div>
                      <div className="mt-1 text-2xl font-bold text-neutral-900">
                        {bbStats.fyc == null ? "—" : `₱${bbStats.fyc.toLocaleString("en-PH",{maximumFractionDigits:0})}`}
                      </div>
                    </div>
                    <div className="rounded-md bg-neutral-100 p-3 text-center">
                      <div className="text-[11px] font-semibold uppercase tracking-wide text-neutral-500">Cases</div>
                      <div className="mt-1 text-2xl font-bold text-neutral-900">
                        {bbStats.cases == null ? "—" : bbStats.cases}
                      </div>
                    </div>
                  </div>
                )}
              </Section>

              <Section title="Prospect">
                <LabeledInput label="Prospect Name *">
                  <div className="relative">
                    <input
                      value={form.prospectName}
                      onChange={(e)=>{ setForm(f=>({...f,prospectName:e.target.value})); setShowMatches(true); }}
                      onFocus={()=>setShowMatches(true)}
                      onBlur={()=>setTimeout(()=>setShowMatches(false),150)}
                      placeholder="e.g., Juan Dela Cruz"
                      autoComplete="off"
                      className={baseField}
                    />
                    {showMatches && prospectMatches.length>0 && (
                      <ul className="absolute z-20 mt-1 max-h-60 w-full overflow-auto rounded-md border border-neutral-200 bg-white shadow-lg">
                        {prospectMatches.map(m=>(
                          <li key={m.name}>
                            <button type="button" onMouseDown={(e)=>e.preventDefault()} onClick={()=>pickProspect(m)}
                              className="flex w-full items-center justify-between gap-3 px-3 py-2 text-left text-sm [@media(hover:hover)]:hover:bg-neutral-100">
                              <span className="min-w-0 truncate font-medium text-neutral-800">{m.name}</span>
                              <span className="shrink-0 text-xs text-neutral-500">
                                {m.count===1?"1 meeting":`${m.count} meetings`}{m.last?` · last ${m.last.date}`:""}
                              </span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                </LabeledInput>
                <div className="grid grid-cols-2 gap-3">
                  <LabeledInput label="Date"><TextInput type="date" value={form.date} onChange={v=>setForm(f=>({...f,date:v}))}/></LabeledInput>
                  <LabeledInput label="Time"><TextInput type="time" value={form.time} onChange={v=>setForm(f=>({...f,time:v}))}/></LabeledInput>
                </div>
              </Section>

              <Section title="Meeting Details" right={<span className="text-xs text-slate-500">{dayName(form.date)}</span>}>
                <LabeledInput label="Venue">
                  <ChoiceGrid options={MEETING_PLACES} value={form.meetingPlace} onChange={(v)=>setForm(f=>({...f,meetingPlace:v}))}/>
                </LabeledInput>
                <div className="grid grid-cols-2 gap-3">
                  <LabeledInput label="Meeting # (1, 2, 3…)"><NumberInput value={form.meetingCount} onChange={v=>setForm(f=>({...f,meetingCount:v}))} min={1}/></LabeledInput>
                  <LabeledInput label="# of Referrals"><NumberInput value={form.referralsGiven} onChange={v=>setForm(f=>({...f,referralsGiven:v}))} min={0} disabled={!canEditOutcome}/></LabeledInput>
                </div>
                {!editingId && priorMeetings.length>0 && (
                  <p className="mt-1 text-xs text-slate-500">
                    Looks like your {ordinal(priorMeetings.length+1)} meeting — last met {priorMeetings[0].date}{priorMeetings[0].meetingPlace?` (${priorMeetings[0].meetingPlace})`:""}. You can change the number if needed.
                  </p>
                )}
              </Section>

              <Section title="What Happened" muted={!canEditOutcome}
                right={!canEditOutcome && <span className="text-xs text-neutral-400">After the meeting</span>}>
                {!canEditOutcome && (
                  <p className="mb-2 text-xs text-slate-500">
                    This meeting is scheduled for the future — you'll fill in what happened after it takes place.
                  </p>
                )}
                <div className={cls(!canEditOutcome && "pointer-events-none opacity-50")}>
                  <YesNoGrid items={yesNoItems} form={form} setForm={setForm}/>
                </div>
              </Section>

              <Section title="Amounts & Product" muted={!canEditAmounts}
                right={<span className={cls("text-xs",
                  !canEditOutcome ? "text-neutral-400" : canEditAmounts ? "text-emerald-700" : "text-neutral-400")}>
                  {!canEditOutcome ? "After the meeting" : canEditAmounts ? "Required" : "Set Paid to Yes"}

          {tab==="calendar" && (()=>{
            // ---- date helpers (local, no timezone drift) ----
            const pad = (n) => String(n).padStart(2, "0");
            const isoOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
            const parseISO = (s) => {
              const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
              return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
            };
            const fmtLong = (iso) => {
              const d = parseISO(iso);
              return d ? d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }) : iso;
            };

            // Normalise events → { name, type, start, end, startTime, endTime, location, details }
            const agencyEvents = (calEvents || []).map(ev => {
              const start = String(ev.startDate || ev.date || "").slice(0, 10);
              const end = String(ev.endDate || start).slice(0, 10) || start;
              return {
                name: ev.eventName || ev.name || "Untitled event",
                type: calType(ev.type),
                start, end: end < start ? start : end,
                startTime: ev.startTime || "", endTime: ev.endTime || "",
                location: ev.location || "", details: ev.details || ev.remarks || "",
              };
            }).filter(e => e.start);

            const nowMs = Date.now();

            // This advisor's own meetings from the Appointment 15 table (the
            // `history` records). Color by lifecycle:
            //   completed → green · upcoming (any future date) → orange ·
            //   past-due scheduled → blue (To Log).
            // Missed meetings are hidden from the calendar.
            const myMeetings = (history || [])
              .filter(r => r && r.kind !== "prospecting" && r.date)
              .map(r => {
                const start = String(r.date || "").slice(0, 10);
                const st = meetingStatusOf(r);
                if (st === "missed") return null;
                let type = "meeting";                 // completed
                if (st === "scheduled") {
                  const when = new Date(`${start}T${r.appointmentTime || "23:59"}`);
                  const overdue = !isNaN(when) && when.getTime() < nowMs;
                  // Any future, not-yet-logged meeting is "upcoming" (orange),
                  // regardless of week; past-due ones are "overdue" (To Log).
                  type = overdue ? "overdue" : "upcoming";
                }
                return {
                  name: r.prospect || "Meeting",
                  type,
                  start, end: start,
                  startTime: r.appointmentTime || "", endTime: "",
                  location: r.meetingPlace || "",
                  details: [r.product, r.remarks].filter(Boolean).join(" · "),
                };
              }).filter(e => e && e.start);

            // Recruitment (BOP) events, folded in as first-class calendar
            // events. Details show how many of this advisor's guests are
            // registered for the event, so the calendar doubles as a prep view.
            const recruitEvents = (bopEvents || []).map(ev => {
              const start = String(ev.eventDate || "").slice(0, 10);
              if (!start) return null;
              const myGuests = (bopGuests || []).filter(g =>
                g.eventName === ev.eventName && g.eventDate === ev.eventDate).length;
              return {
                name: ev.eventName || "Recruitment event",
                type: "recruit",
                start, end: start,
                startTime: ev.startTime || "", endTime: ev.endTime || "",
                location: ev.location || "",
                details: [
                  myGuests > 0 ? `${myGuests} of your guest${myGuests > 1 ? "s" : ""} registered` : "",
                  ev.remarks || "",
                ].filter(Boolean).join(" · "),
              };
            }).filter(Boolean);

            const events = agencyEvents.concat(myMeetings).concat(recruitEvents);

            // Does an event cover this ISO day? (inclusive of multi-day spans)
            const coversDay = (e, iso) => e.start <= iso && iso <= e.end;

            // Visible month grid: 6 weeks starting on Sunday.
            const [vy, vm] = calMonth.split("-").map(Number);
            const first = new Date(vy, vm - 1, 1);
            const gridStart = new Date(first);
            gridStart.setDate(1 - first.getDay());
            const todayISO = todayISODate();
            const monthLabel = first.toLocaleDateString(undefined, { month:"long", year:"numeric" });
            const shiftMonth = (delta) => {
              const d = new Date(vy, vm - 1 + delta, 1);
              setCalMonth(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
              setCalDay("");
            };

            // Minutes since midnight for a "9:00 AM" / "1:30 PM" style string, so
            // same-day events sort by real clock time rather than as text
            // (where "10:30 AM" would wrongly precede "9:00 AM"). Blank/unknown
            // times sort last within the day.
            const timeMin = (s) => {
              const m = /^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?/.exec(String(s || "").trim());
              if (!m) return 24 * 60;
              let h = +m[1] % 12;
              if (m[3] && m[3].toLowerCase() === "pm") h += 12;
              return h * 60 + (+m[2]);
            };
            // Agenda: a chosen day's events, else everything from today forward.
            const agenda = (calDay
              ? events.filter(e => coversDay(e, calDay))
              : events.filter(e => e.end >= todayISO)
            ).sort((a, b) =>
              a.start !== b.start
                ? a.start.localeCompare(b.start)
                : timeMin(a.startTime) - timeMin(b.startTime));

            // Paginate the agenda: 10 per page with Prev/Next.
            const CAL_PAGE = 10;
            const pageCount = Math.max(1, Math.ceil(agenda.length / CAL_PAGE));
            const page = Math.min(calPage, pageCount - 1);
            const pageStart = page * CAL_PAGE;
            const pagedAgenda = agenda.slice(pageStart, pageStart + CAL_PAGE);

            const cells = Array.from({ length: 42 }, (_, i) => {
              const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
              const iso = isoOf(d.getFullYear(), d.getMonth(), d.getDate());
              const dayEvents = events.filter(e => coversDay(e, iso));
              // One dot per event, grouped agency → AIA → my meetings.
              const evTypes = dayEvents.map(e => e.type)
                .sort((a, b) => (CAL_TYPE_ORDER[a] ?? 9) - (CAL_TYPE_ORDER[b] ?? 9));
              return { iso, day:d.getDate(), inMonth:d.getMonth() === vm - 1, isToday: iso===todayISO, evTypes, count:evTypes.length };
            });

            const EventCard = ({ e, i }) => {
              const t = CAL_TYPES[e.type];
              return (
                <div key={i} className="rounded-md border border-neutral-200 bg-white px-3 py-2.5 shadow-sm">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="break-words text-sm font-semibold text-neutral-900">{e.name}</div>
                      <div className="mt-0.5 text-xs text-neutral-500">
                        {fmtLong(e.start)}{e.end!==e.start ? ` – ${fmtLong(e.end)}` : ""}
                        {e.startTime ? ` · ${e.startTime}${e.endTime?`–${e.endTime}`:""}` : ""}
                      </div>
                      {e.location && <div className="text-xs text-neutral-500">{e.location}</div>}
                    </div>
                    <span className={cls("shrink-0 rounded-md border px-2 py-0.5 text-[10px] font-semibold", t.chip)}>{t.label}</span>
                  </div>
                  {e.details && <div className="mt-1.5 whitespace-pre-line text-xs text-neutral-600">{e.details}</div>}
                </div>
              );
            };

            return (
              <Section title="Agency Calendar" right={
                <button type="button" onClick={()=>pullCalendar(true)} aria-label="Refresh calendar" title="Refresh"
                  className="text-brand-600 [@media(hover:hover)]:hover:text-brand-700 active:scale-95 transition">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-4 w-4">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <path d="M21 3v6h-6" />
                  </svg>
                </button>
              }>
                {(!settings.advisorName || !settings.syncKey) ? (
                  <div className="rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-700">
                    Set your name, unit, and sync key in Settings to load the calendar.
                  </div>
                ) : (
                  <div className="grid gap-3">
                    {/* Legend */}
                    <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs text-neutral-600">
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.agency.dot)} />Agency</span>
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.aia.dot)} />AIA</span>
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.recruit.dot)} />Recruitment</span>
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.meeting.dot)} />Past Meetings</span>
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.upcoming.dot)} />Upcoming Meetings</span>
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.overdue.dot)} />To Log</span>
                    </div>
                    <hr className="border-neutral-200" />

                    {/* Month header */}
                    <div className="flex items-center justify-between">
                      <button type="button" onClick={()=>shiftMonth(-1)} aria-label="Previous month" className={cls(btnSecondary, "h-9 w-9 px-0")}>‹</button>
                      <div className="text-sm font-semibold text-neutral-900">{monthLabel}</div>
                      <button type="button" onClick={()=>shiftMonth(1)} aria-label="Next month" className={cls(btnSecondary, "h-9 w-9 px-0")}>›</button>
                    </div>

                    {/* Month grid */}
                    <div>
                      <div className="grid grid-cols-7 text-center text-[10px] font-medium text-neutral-400">
                        {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} className="py-1">{d}</div>)}
                      </div>
                      <div className="grid grid-cols-7 gap-1">
                        {cells.map(c=>{
                          const selected = c.iso===calDay;
                          return (
                            <button key={c.iso} type="button"
                              onClick={()=>setCalDay(d=>d===c.iso?"":c.iso)}
                              className={cls(
                                "flex h-11 flex-col items-center justify-start rounded-md border pt-1 text-xs transition",
                                selected ? "border-brand-500 bg-brand-50" : "border-transparent [@media(hover:hover)]:hover:bg-neutral-50",
                                c.inMonth ? "text-neutral-800" : "text-neutral-300")}>
                              <span className={cls("flex h-5 w-5 items-center justify-center rounded-full",
                                c.isToday && "bg-ink text-white font-semibold")}>{c.day}</span>
                              <span className="mt-0.5 flex flex-col items-center gap-0.5 leading-none">
                                {[0,3].map(rowStart=>{
                                  const row = c.evTypes.slice(0,6).slice(rowStart, rowStart+3);
                                  if(!row.length) return null;
                                  return (
                                    <span key={rowStart} className="flex items-center gap-0.5">
                                      {row.map((t,idx)=><span key={idx} className={cls("h-1.5 w-1.5 rounded-full", CAL_TYPES[t].dot)} />)}
                                      {c.count>6 && rowStart===3 && (
                                        <span className="ml-0.5 text-[8px] font-semibold leading-none text-neutral-400">+{c.count-6}</span>
                                      )}
                                    </span>
                                  );
                                })}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Agenda */}
                    <hr className="border-neutral-200" />
                    <div className="grid gap-1.5">
                      <div className="flex items-center justify-between py-1.5">
                        <div className="text-xs font-semibold uppercase tracking-wide text-neutral-500">
                          {calDay ? fmtLong(calDay) : "Upcoming"}
                        </div>
                        {calDay && <button type="button" onClick={()=>setCalDay("")} className="text-xs font-medium text-brand-600 underline">Show upcoming</button>}
                      </div>
                      {agenda.length===0
                        ? <div className="text-sm text-neutral-500">{calDay ? "No events on this day." : "No upcoming events."}</div>
                        : pagedAgenda.map((e,i)=><EventCard key={pageStart+i} e={e} i={pageStart+i} />)}

                      {agenda.length > CAL_PAGE && (
                        <div className="mt-1 flex items-center justify-between">
                          <button type="button" disabled={page<=0} onClick={()=>setCalPage(p=>Math.max(0,p-1))}
                            className={cls(btnSecondary, "h-9 px-3 text-xs")}>‹ Prev</button>
                          <span className="text-xs text-neutral-500">
                            {pageStart+1}–{Math.min(pageStart+CAL_PAGE, agenda.length)} of {agenda.length}
                          </span>
                          <button type="button" disabled={page>=pageCount-1} onClick={()=>setCalPage(p=>Math.min(pageCount-1,p+1))}
                            className={cls(btnSecondary, "h-9 px-3 text-xs")}>Next ›</button>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </Section>
            );
          })()}

          <FloatingTabBar tab={tab} setTab={goToTab} calendarBadge={pastDueMeetings.length} />
          
          {toast && <Toast text={toast.t} quote={toast.quote} type={toast.type||"ok"} onClose={()=>setToast(null)}/>}
        </Page>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
