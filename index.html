<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Appointment 15 Logger</title>
  <style>
    :root{
      /* Supernova accent (kept as an accent, no longer the dominant colour) */
      --sn-red:#DD467D; --sn-red-light:#F7B4CC; --sn-black:#111827; --sn-gray:#6b7280; --sn-orange:#ea580c;
      /* shadcn "neutral" design tokens (adopted from the Appt 5 Logger) */
      --background:#ffffff; --foreground:#171A2B;
      --card:#ffffff; --card-foreground:#0a0a0a;
      --muted:#f5f5f5; --muted-foreground:#737373;
      --border:#e5e5e5; --input:#e5e5e5; --ring:#0a0a0a;
      --primary:#171717; --primary-foreground:#fafafa;
      --page:#F6F6FB;
      --emerald:#059669;
      --line:#e5e7eb;
      --radius:0.5rem;
      /* Nova palette anchors */
      --brand:#DD467D; --brand-deep:#C2356A;
      --ink:#171A2B;
    }
    @supports (color: color-mix(in srgb, black, white)) {
      :root{ --sn-red-light: color-mix(in srgb, var(--sn-red) 35%, white); }
    }
    html,body{min-height:100%}
    body{
      background-color:var(--page);
      color:var(--foreground);
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    @keyframes toastIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes toastBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
    input,select,button,textarea{font:inherit;font-size:16px}
    input[type="date"],input[type="time"]{
      -webkit-appearance:none;appearance:none;height:3rem;line-height:3rem;padding:0 .75rem;font-size:16px;font-variant-numeric:tabular-nums;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','-apple-system','Segoe UI','Roboto','Helvetica','Arial','sans-serif'] },
      colors: {
        // Nova palette — magenta brand + navy ink (indigo/emerald/amber/rose come from Tailwind defaults)
        brand: { 50:'#FCE7F0', 500:'#DD467D', 600:'#DD467D', 700:'#C2356A' },
        ink: '#171A2B',
      },
    } } };
  </script>
  <link rel="preload" href="./supernova-wordmark.png" as="image">

  <!-- Favicon (desktop browsers, bookmarks, tabs) -->
  <link rel="icon" type="image/png" href="./loggericon.png">
  <link rel="shortcut icon" type="image/png" href="./loggericon.png">

  <!-- iOS home screen / Add to Home Screen -->
  <link rel="apple-touch-icon" href="./loggericon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Appt 15 Logger">
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <!-- App -->
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;
    const SYNC_URL = "/api/sync";   // ← our secure proxy

    // Morning Meeting Tracker — external MS Form
    const MORNING_FORM_URL = "https://forms.office.com/pages/responsepage.aspx?id=ABksf9SfiUuR03mmSZlvCrCSxsWIsXRHsrgtzBLED-tUMksxNFc0RTdYQkoyQjNBWU0yUTBLOVZVVS4u&route=shorturl";

    // Prospecting POST target (proxy forwards to GAS /prospecting)
    const PROSPECT_URL = `${SYNC_URL}?path=prospecting`;
    // If your proxy doesn’t support subpaths, use this instead:
    // const PROSPECT_URL = `${SYNC_URL}?path=prospecting`;

    // ---- shadcn-style class tokens (adopted from the Appt 5 Logger) ----
    const btnPrimary =
      "inline-flex items-center justify-center rounded-md bg-brand-600 px-4 py-2 text-sm font-medium " +
      "text-white shadow-sm transition [@media(hover:hover)]:hover:bg-brand-700 active:scale-[0.98] " +
      "disabled:opacity-50 disabled:pointer-events-none";
    const btnSecondary =
      "inline-flex items-center justify-center rounded-md border border-neutral-200 bg-white px-4 py-2 text-sm font-medium " +
      "text-neutral-900 shadow-sm transition [@media(hover:hover)]:hover:bg-neutral-100 active:scale-[0.98] " +
      "disabled:opacity-50 disabled:pointer-events-none";
    const btnDestructive =
      "inline-flex items-center justify-center rounded-md border border-red-200 bg-white px-3 py-2 text-sm font-medium " +
      "text-red-600 shadow-sm transition [@media(hover:hover)]:hover:bg-red-50 active:scale-[0.98]";

    const pillGreen = "rounded-md border border-emerald-300 bg-emerald-50 text-emerald-700";
    
    const cls = (...xs) => xs.filter(Boolean).join(" ");
    const todayISODate = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
    const nowHM = () => { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
    const dayName = (iso) => new Date(iso).toLocaleDateString(undefined,{weekday:"long"});

    // --- History identity / de-duplication ---
    // A stable content signature so the same appointment is recognised across
    // devices/syncs even when the server row carries no (or a different) id.
    const histNorm = (v) => (v==null?"":String(v)).trim().toLowerCase();
    // Identify an appointment by prospect + date + time. Advisor is deliberately
    // excluded: history is single-advisor per device, and the server sometimes
    // returns rows with a missing/differently-cased advisor, which would
    // otherwise stop a local copy and its synced copy from collapsing.
    const histSig = (r) => [histNorm(r.prospect), histNorm(r.date), histNorm(r.appointmentTime)].join("|");
    // Collapse identical appointments, keeping the first seen and back-filling
    // any fields it is missing from later copies.
    const dedupeHistory = (list) => {
      const seen = new Map();   // signature -> index in out
      const out = [];
      for (const r of Array.isArray(list) ? list : []) {
        if (!r) continue;
        const sig = histSig(r);
        if (histNorm(r.prospect) && seen.has(sig)) {
          const i = seen.get(sig);
          out[i] = { ...r, ...out[i] };   // existing wins; fill blanks from r
          continue;
        }
        seen.set(sig, out.length);
        out.push(r);
      }
      return out;
    };

    const LS = { settings:"sn.meet.settings.v1", history:"sn.meet.history.v1", outbox:"sn.meet.outbox.v1", bopEvents:"sn.meet.bopevents.v1", bopGuests:"sn.meet.bopguests.v1", calEvents:"sn.meet.calevents.v1", prospectHistory:"sn.meet.prospecthistory.v1" };

    // Calendar event "Type" → color treatment.
    //   Agency  (internal Supernova events) → purple
    //   AIA     (AIA / company events)      → pink-red (rose)
    //   Meeting (this advisor's own meetings)→ green
    const CAL_TYPES = {
      agency:  { label:"Agency",     dot:"bg-purple-500",  chip:"border-purple-200 bg-purple-50 text-purple-700",     ring:"ring-purple-400" },
      aia:     { label:"AIA",        dot:"bg-rose-500",    chip:"border-rose-200 bg-rose-50 text-rose-700",           ring:"ring-rose-400" },
      meeting: { label:"My Meeting", dot:"bg-green-500",   chip:"border-green-200 bg-green-50 text-green-700",        ring:"ring-green-400" },
    };
    // Draw order for the day-cell dots (agency, then aia, then my meetings).
    const CAL_TYPE_ORDER = { agency: 0, aia: 1, meeting: 2 };
    const calType = (t) => (String(t||"").trim().toLowerCase().startsWith("aia") ? "aia" : "agency");
    const LS_SYNC = { last: "sn.meet.lastsync.v1" };

    const DEFAULT_ENDPOINT = "https://script.google.com/macros/s/AKfycbyIvFrqE7DwV7TgOx9L3tfDz14F8j9_ePSfhAmpTOB2Mt-LdkLq3h4bFKHQjQUUpZc0UQ/exec";

    const baseField =
      "flex w-full h-12 rounded-md border border-neutral-200 bg-white px-3 text-[16px] leading-none " +
      "shadow-sm outline-none transition placeholder:text-neutral-400 " +
      "focus-visible:ring-2 focus-visible:ring-sky-500 focus-visible:ring-offset-1";

    const UNIT_OPTIONS = ["Supernova Direct","Aquila Direct","Stellar Direct","Aurora","Alphara"];
    const PRODUCT_OPTIONS = ["A+ Signature","ACP 100","ACP Plus","AHIP","AJCP","All-in-One","Ascend","Family Secure","Future Builder","Future Scholar","Goals Protect","Guardian 1","Guardian 5","Guardian 65","Health Achieve","Max Protect","Money Tree","Platinum Secure","Other"];
    const MEETING_PLACES = ["Zoom","Cafe/Resto","Client Home","Client Office","AIA Office","Other"];

    const QUOTES = [
      "Great days are built one call at a time.","Consistency compounds. Keep swinging!","Prospect today, paid tomorrow.","Hard work works!",
      "Tiny progress today, massive results later.","Energy up, pipeline up!","Every conversation is a seed.","Discipline > motivation!",
      "Energy is contagious—share it!","You only lose if you stop."
    ];
    const getRandomQuote = () => QUOTES[Math.floor(Math.random()*QUOTES.length)];

    const defaultSettings = { advisorName: "", unit: "", syncKey: "" };
    const emptyForm = { prospectName:"", date:todayISODate(), time:nowHM(), meetingPlace:"Zoom",
      firstMeeting:true, meetingCount:1, factFinding:false, appSubmitted:false, casePaid:false,
      caseApproved:false, referralsGiven:0, fyp:"", fyc:"", product:"" };

    const readLS = (k,f)=>{ try{ const v=JSON.parse(localStorage.getItem(k)||"null"); return v??f; }catch{return f;} };
    const writeLS = (k,v)=>localStorage.setItem(k,JSON.stringify(v));

    const Page = ({children}) => (
      <div className="min-h-[100dvh] w-full bg-transparent text-slate-900">
        <div className="mx-auto w-full max-w-md px-4 pb-36">{children}</div>
      </div>
    );

    // put near the top of your script (you already have this line)
    const LOGO_SRC = "./supernova-wordmark.png";

    // --- inline lucide-style icons (adopted from the Appt 5 Logger) ---
    const IconSettings = ({ className="h-5 w-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        className={className} aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    );

    // replace the whole TopBar component with this:
    const WeeklyAppointmentGoal = ({ slots }) => {
      const [activeSlotIndex, setActiveSlotIndex] = useState(null);
      const [hoveredSlotIndex, setHoveredSlotIndex] = useState(null);
      const activeTooltipIndex = hoveredSlotIndex ?? activeSlotIndex;

      return (
      <div
        className="mt-3 grid gap-1.5"
        style={{ gridTemplateColumns: "repeat(15, minmax(0, 1fr))" }}
        aria-label={`${slots.filter(slot => slot.status !== "empty").length} of 15 appointments logged this week`}
      >
        {slots.map((slot, index) => {
          const isPaid = slot.status === "paid";
          const isMeeting = slot.status === "meeting" || isPaid;
          const tooltipText = slot.tooltip || `Appointment ${index + 1}: open`;
          const showTooltip = isMeeting && activeTooltipIndex === index;
          const tooltipAlign = index < 3
            ? "left-0"
            : index > 11
              ? "right-0"
              : "left-1/2 -translate-x-1/2";
          return (
            <button
              type="button"
              key={index}
              title={tooltipText}
              aria-label={tooltipText}
              onClick={() => setActiveSlotIndex(activeSlotIndex === index ? null : index)}
              onMouseEnter={() => setHoveredSlotIndex(index)}
              onMouseLeave={() => setHoveredSlotIndex(null)}
              onFocus={() => setHoveredSlotIndex(index)}
              onBlur={() => setHoveredSlotIndex(null)}
              className={cls(
                "relative flex h-4 w-full min-w-0 items-center justify-center rounded-[3px] border shadow-sm outline-none transition focus-visible:ring-2 focus-visible:ring-sky-500",
                isPaid
                  ? "border-emerald-600 bg-emerald-600"
                  : isMeeting
                    ? "border-indigo-600 bg-indigo-500"
                    : "border-neutral-300 bg-white"
              )}
            >
              {isPaid && (
                <svg
                  viewBox="0 0 12 10"
                  className="h-3 w-3 text-white"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2.4"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1.5 5.1 4.4 8 10.5 1.5" />
                </svg>
              )}
              {showTooltip && (
                <span className={cls("pointer-events-none absolute top-full z-30 mt-2 whitespace-nowrap rounded-md bg-neutral-900 px-2 py-1 text-[11px] font-medium text-neutral-50 shadow-lg", tooltipAlign)}>
                  {tooltipText}
                </span>
              )}
            </button>
          );
        })}
      </div>
      );
    };

    const TopBar = ({ settingsOpen, onToggleSettings, pendingCount, weeklyGoalSlots }) => {
      const done = weeklyGoalSlots.filter(s => s.status !== "empty").length;
      return (
      <header className="sticky top-0 z-50 mb-4 border-b border-neutral-200 bg-white/80 backdrop-blur overflow-visible">
        <div className="px-4 pt-4 pb-4">
          <div className="flex items-start justify-between">
            <div className="min-w-0">
              <img src={LOGO_SRC} alt="Supernova Financial" className="mb-2 h-12 md:h-14 select-none" />
              <div className="flex items-center gap-2">
                <span className="inline-block h-2.5 w-2.5 shrink-0 rounded-full" style={{ backgroundColor: "var(--sn-red)" }} />
                <h1 className="text-lg font-semibold leading-tight tracking-tight">Appointment 15 Logger</h1>
              </div>
              <p className="mt-0.5 text-sm text-neutral-500">{done} of 15 meetings this week</p>
            </div>
            <button
              onClick={onToggleSettings}
              aria-pressed={settingsOpen}
              aria-expanded={settingsOpen}
              title="Settings"
              className={cls(
                "ml-3 inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md border shadow-sm transition",
                settingsOpen
                  ? "border-ink bg-ink text-neutral-50"
                  : "border-neutral-200 bg-white text-neutral-700 [@media(hover:hover)]:hover:bg-neutral-100"
              )}
            >
              <IconSettings className={cls("h-5 w-5 transition-transform", settingsOpen && "rotate-45")} />
            </button>
          </div>
          <WeeklyAppointmentGoal slots={weeklyGoalSlots} />
        </div>

        {pendingCount > 0 && (
          <div className="px-4 pb-3">
            <span className="inline-flex items-center gap-2 rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-medium text-amber-700">
              <span className="inline-block h-2 w-2 rounded-full bg-amber-500" />
              {pendingCount} queued — will sync when online
            </span>
          </div>
        )}
      </header>
      );
    };
        
    const Section = ({title,children,right,muted=false}) => (
      <section className={cls("mb-4 rounded-lg border border-neutral-200 p-4 shadow-sm transition-colors",
        muted ? "bg-neutral-100" : "bg-white")}>
        <div className="mb-3 flex items-center justify-between">
          <h2 className={cls("text-sm font-semibold", muted ? "text-neutral-400" : "text-neutral-900")}>{title}</h2>{right}
        </div>
        <div className={cls(muted && "pointer-events-none opacity-50")}>{children}</div>
      </section>
    );
    const LabeledInput = ({label,children}) => (
      <label className="mb-4 block">
        <div className="mb-2 text-sm font-medium text-neutral-700">{label}</div>
        {children}
      </label>
    );

    // Collapsible wrapper that slides down/up
    const Slide = ({ open, children }) => (
      <div
        className={cls(
          // grid trick: animate 0fr → 1fr without measuring height
          "grid transition-all duration-300 ease-out",
          open
            ? "grid-rows-[1fr] opacity-100 translate-y-0"
            : "grid-rows-[0fr] opacity-0 -translate-y-2 pointer-events-none"
        )}
        aria-hidden={!open}
      >
        {/* inner wrapper is the row that actually collapses */}
        <div className="overflow-hidden">
          {children}
        </div>
      </div>
    );

    const TextInput = ({ value, onChange, placeholder, type="text", inputMode }) => (
      <input value={value} onChange={(e)=>onChange(e.target.value)} type={type} inputMode={inputMode} placeholder={placeholder} className={baseField}/>
    );
    const NumberInput = ({ value, onChange, step=1, min=0, placeholder }) => (
      <input value={value} onChange={(e)=>onChange(e.target.value===""?"":Number(e.target.value))} type="number" step={step} min={min} inputMode="numeric" placeholder={placeholder} className={baseField+" appearance-none"}/>
    );
    const MoneyInput = ({ value, onChange, placeholder, disabled = false }) => {
      const display = value === "" || value == null ? "" : new Intl.NumberFormat("en-PH").format(Number(value));
      return (
        <input
          type="text"
          inputMode="numeric"
          value={display}
          placeholder={placeholder}
          onChange={(e) => {
            if (disabled) return;
            const digits = e.target.value.replace(/\D/g, "");
            onChange(digits === "" ? "" : Number(digits));
          }}
          disabled={disabled}
          className={cls(baseField, disabled && "bg-neutral-100 text-neutral-400 cursor-not-allowed")}
        />
      );
    };
    const Select = ({ value, onChange, options, placeholder, disabled = false }) => (
      <div className="relative">
        <select
          value={value}
          onChange={(e) => onChange(e.target.value)}
          disabled={disabled}
          className={cls(
            baseField,
            "appearance-none pr-10",
            disabled && "bg-neutral-100 text-neutral-400 cursor-not-allowed"
          )}
        >
          <option value="" disabled hidden>{placeholder || "-- Select --"}</option>
          {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
        </select>
        <svg
          className={cls(
            "pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4",
            disabled ? "text-neutral-300" : "text-neutral-500"
          )}
          viewBox="0 0 20 20"
          fill="currentColor"
          aria-hidden="true"
        >
          <path fillRule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.27a.75.75 0 01.02-1.06z" clipRule="evenodd"/>
        </svg>
      </div>
    );
    const ChoiceGrid = ({ options, value, onChange }) => {
      const cols = 3;
      const lastRowStart = (Math.ceil(options.length / cols) - 1) * cols;
      return (
        <div className="grid grid-cols-3 overflow-hidden rounded-md border border-neutral-200">
          {options.map((opt, i)=>(
            <button key={opt} type="button" onClick={()=>onChange(opt)}
              className={cls("h-14 text-sm font-medium transition active:scale-[0.99] border-neutral-200",
                (i % cols !== cols - 1) && "border-r",
                (i < lastRowStart) && "border-b",
                value===opt
                  ? "bg-indigo-500 text-white"
                  : "bg-white text-neutral-800 [@media(hover:hover)]:hover:bg-neutral-50")}>
              {opt}
            </button>
          ))}
        </div>
      );
    };
    
    // Shared wrapper so every nav icon is drawn identically:
    // same 24×24 grid, same stroke weight, monochromatic (uses currentColor).
    const NavIcon = ({ children }) => (
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="1.8"
        strokeLinecap="round"
        strokeLinejoin="round"
        aria-hidden="true"
        className="w-5 h-5 sm:w-6 sm:h-6 mb-1 opacity-90"
      >
        {children}
      </svg>
    );

    // 5 uniform, monochromatic line icons.
    const ICONS = {
      // New Meeting — calendar with a plus
      log: (
        <NavIcon>
          <rect x="3" y="4.5" width="18" height="16" rx="2.5" />
          <path d="M3 9h18" />
          <path d="M8 2.5v4" />
          <path d="M16 2.5v4" />
          <path d="M12 12.5v5" />
          <path d="M9.5 15h5" />
        </NavIcon>
      ),
      // History — clock with a counter-clockwise arrow
      history: (
        <NavIcon>
          <path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M12 7.5v5l3.5 2" />
        </NavIcon>
      ),
      // Telethon — phone handset with call waves
      telethon: (
        <NavIcon>
          <path d="M15.5 3.5a5 5 0 0 1 5 5" />
          <path d="M15 7a2.5 2.5 0 0 1 2 2" />
          <path d="M6.8 4H4.3A1.8 1.8 0 0 0 2.5 6a15.5 15.5 0 0 0 15 15 1.8 1.8 0 0 0 2-1.8v-2.5a1.8 1.8 0 0 0-1.55-1.78l-2.2-.3a1.8 1.8 0 0 0-1.63.63l-.72.86a12 12 0 0 1-5.24-5.24l.86-.72a1.8 1.8 0 0 0 .63-1.63l-.3-2.2A1.8 1.8 0 0 0 6.8 4Z" />
        </NavIcon>
      ),
      // Morning Meeting — sunrise over the horizon
      morning: (
        <NavIcon>
          <path d="M17 18a5 5 0 0 0-10 0" />
          <path d="M12 2v6" />
          <path d="M9.5 5.5 12 3l2.5 2.5" />
          <path d="M4.3 10.3l1.4 1.4" />
          <path d="M18.3 11.7l1.4-1.4" />
          <path d="M2 18h2" />
          <path d="M20 18h2" />
          <path d="M2 22h20" />
        </NavIcon>
      ),
      // Calendar — grid with a dot (agency events)
      calendar: (
        <NavIcon>
          <rect x="3" y="4.5" width="18" height="16" rx="2.5" />
          <path d="M3 9h18" />
          <path d="M8 2.5v4" />

    const YesNoGrid = ({ items, form, setForm }) => {
      const cols = 2;
      const lastRowStart = (Math.ceil(items.length / cols) - 1) * cols;
      return (
        <div className="grid grid-cols-2 overflow-hidden rounded-md border border-neutral-200">

                className={cls("flex h-14 w-full items-center justify-between px-4 text-sm font-medium transition active:scale-[0.99] border-neutral-200",
                  (i % cols !== cols - 1) && "border-r",
                  (i < lastRowStart) && "border-b",
                  value

                    : "bg-white text-neutral-700 [@media(hover:hover)]:hover:bg-neutral-50")}>
                <span className="text-left">{it.label}</span>
                <span className={cls("text-sm font-semibold tracking-wide", value ? "text-white" : "text-neutral-400")}>{value?"YES":"NO"}</span>
              </button>

      );
    };

    const Toast = ({ text, quote, type="ok", onClose }) => {
      React.useEffect(()=>{ const t=setTimeout(onClose,3000); navigator.vibrate?.(40); return ()=>clearTimeout(t); },[onClose]);
      const accent = type==="ok" ? "bg-emerald-500" : type==="warn" ? "bg-amber-500" : "bg-rose-500";
      return (
        <div className="fixed inset-0 z-[120] flex items-start justify-center pointer-events-none" role="status" aria-live="polite">
          <div className="mt-16 md:mt-24 pointer-events-auto animate-[toastIn_.18s_ease-out] w-[min(92vw,26rem)]">
            <div className="overflow-hidden rounded-lg border border-ink bg-ink text-neutral-50 shadow-2xl">
              <div className="flex items-center gap-3 px-4 py-3">
                <span className={cls("h-2.5 w-2.5 shrink-0 rounded-full", accent)} />
                <div className="min-w-0">
                  <div className="text-sm font-semibold">{text}</div>
                  {quote && <div className="mt-0.5 text-[13px] text-neutral-300">{quote}</div>}
                </div>
              </div>
              <div className="h-0.5 bg-neutral-700">
                <div className={cls("h-full origin-left animate-[toastBar_3s_linear]", accent)} />
              </div>
            </div>
          </div>
        </div>
      );
    };
    async function sendToEndpoint(url, record){
      const sameOrigin = url.startsWith('/') || url.startsWith(location.origin);
      try{
        const res = await fetch(url, {
          method: 'POST',
          body: JSON.stringify(record),
          headers: { 'Content-Type': sameOrigin ? 'application/json' : 'text/plain' },
          ...(sameOrigin ? {} : { mode: 'no-cors' }),
        });
        return sameOrigin ? res.ok : (res.ok || res.type === 'opaque');
      } catch {
        return false;
      }
    }

    function App(){
      const [lastSyncAt, setLastSyncAt] = useState(() => readLS(LS_SYNC.last, ""));
      
      // state (declare before effects)
      const [settings,setSettings]=useState(()=>({...defaultSettings,...readLS(LS.settings,{})}));
      const [form,setForm]=useState(()=>({...emptyForm}));
      const [tab,setTab]=useState("log");
      const [history,setHistory]=useState(()=>readLS(LS.history,[]));
      const [outbox,setOutbox]=useState(()=>readLS(LS.outbox,[]));
      const [openSettings,setOpenSettings]=useState(false);
      const [toast,setToast]=useState(null);
      const [editingId,setEditingId]=useState(null);
      const [historyQuery,setHistoryQuery]=useState("");

      // Recruit (BOP guests): the event list + this advisor's registered guests.
      const [bopEvents, setBopEvents] = useState(() => readLS(LS.bopEvents, []));
      const [bopGuests, setBopGuests] = useState(() => readLS(LS.bopGuests, []));
      const [recruit, setRecruit] = useState({ eventKey: "", guestName: "" });
      useEffect(() => writeLS(LS.bopEvents, bopEvents), [bopEvents]);
      useEffect(() => writeLS(LS.bopGuests, bopGuests), [bopGuests]);

      // Calendar: read-only agency events (from the 'Calendar' tab). Cached so
      // the month/agenda render instantly offline. `calMonth` is the visible
      // month (YYYY-MM); `calDay` is the selected day (YYYY-MM-DD) or "".
      const [calEvents, setCalEvents] = useState(() => readLS(LS.calEvents, []));
      const [calMonth, setCalMonth] = useState(() => todayISODate().slice(0, 7));
      const [calDay, setCalDay] = useState("");
      const [calPage, setCalPage] = useState(0);   // agenda pagination (10/page)
      useEffect(() => writeLS(LS.calEvents, calEvents), [calEvents]);
      // Reset to the first page whenever the agenda's contents change.
      useEffect(() => { setCalPage(0); }, [calDay, calMonth, calEvents]);

      const filteredHistory = useMemo(() => {
        const q = historyQuery.trim().toLowerCase();
        if (!q) return history;
        return history.filter(r => {
          const steps = [
            r.factFinding==="Yes" && "KYC Done",
            r.appSubmitted==="Yes" && "Submitted",
            r.casePaid==="Yes" && "Paid",
            r.caseApproved==="Yes" && "Approved",
          ].filter(Boolean).join(" ");
          const hay = [
            r.prospect, r.meetingPlace, r.product, r.date, r.appointmentTime,
            r.firstMeeting==="Yes" ? "First meeting" : "", steps,
          ].filter(Boolean).join(" ").toLowerCase();
          return hay.includes(q);
        });
      }, [history, historyQuery]);

      // --- Compact history: newest-first, grouped by month, rendered a window at a time ---
      const HISTORY_PAGE = 40;
      const [expandedIds, setExpandedIds] = useState(() => new Set());
      const [visibleCount, setVisibleCount] = useState(HISTORY_PAGE);
      // Reset the window (and open rows) whenever the search changes.
      useEffect(() => { setVisibleCount(HISTORY_PAGE); setExpandedIds(new Set()); }, [historyQuery]);

      const toggleExpanded = (id) => setExpandedIds(prev => {
        const next = new Set(prev);
        next.has(id) ? next.delete(id) : next.add(id);
        return next;
      });

      const monthKeyOf = (iso) => (iso || "").slice(0, 7); // YYYY-MM ("" sorts last)
      const monthLabelOf = (key) => {
        if (!key) return "No date";
        const [y, m] = key.split("-").map(Number);
        return new Date(y, (m || 1) - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
      };

      const sortedHistory = useMemo(() =>
        filteredHistory.slice().sort((a, b) =>
          `${b.date || ""} ${b.appointmentTime || ""}`.localeCompare(`${a.date || ""} ${a.appointmentTime || ""}`)),
        [filteredHistory]);

      // Total meetings per month across the full (filtered) set, so a month
      // header can show its true count even when the window cuts it off.
      const monthTotals = useMemo(() => {
        const t = {};
        for (const r of sortedHistory) { const k = monthKeyOf(r.date); t[k] = (t[k] || 0) + 1; }
        return t;
      }, [sortedHistory]);

      // ---- Pomodoro (25:00) ----
      const POMO_SECONDS = 25 * 60;
      const [timerSec, setTimerSec] = useState(POMO_SECONDS);
      const [timerRunning, setTimerRunning] = useState(false);
      
      useEffect(() => {
        if (!timerRunning) return;
        const id = setInterval(() => {
          setTimerSec(s => (s > 0 ? s - 1 : 0));
        }, 1000);
        return () => clearInterval(id);
      }, [timerRunning]);
      
      useEffect(() => {
        if (timerSec === 0 && timerRunning) {
          setTimerRunning(false);
          setToast({ t: "Time’s up! ⏱️", type: "ok" });
        }
      }, [timerSec, timerRunning]);
      
      const pauseTimer  = () => setTimerRunning(false);
      const startTimer  = () => setTimerRunning(true);
      const resetTimer  = () => { setTimerRunning(false); setTimerSec(POMO_SECONDS); };
      
      const mm = String(Math.floor(timerSec / 60)).padStart(2, "0");
      const ss = String(timerSec % 60).padStart(2, "0");

      // run once after mount
      useEffect(() => {
        setHistory(h => dedupeHistory(h.filter(rec => rec && rec.prospect && rec.kind !== "prospecting")));
      }, []);

      // --- Prospecting helpers ---
      const toLocalISO = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      };
      
      const weekEndingSunday = (isoDate) => {
        // build Date in local time (not UTC)
        const [y, m, d] = isoDate.split("-").map(Number);
        const dt = new Date(y, m - 1, d);     // local
        const add = (7 - dt.getDay()) % 7;    // days to next Sunday (0 if already Sun)
        dt.setDate(dt.getDate() + add);
        return toLocalISO(dt);                 // local yyyy-mm-dd
      };

      // --- maintenance helpers ---
      function clearHistoryAndOutbox() {
        localStorage.removeItem(LS.history);
        localStorage.removeItem(LS.outbox);
        localStorage.removeItem(LS_SYNC.last);
        setHistory([]);
        setOutbox([]);
        setLastSyncAt("");
        setToast({ t: "Cleared local history and outbox. You can sync again.", type: "ok" });
      }
      
      function forceFullSync() {
        setLastSyncAt("");
        writeLS(LS_SYNC.last, "");
        pullUpdates();
      }
      
      function nukeEverything() {
        if (!confirm("Remove ALL settings (name, unit, sync key) and local data?")) return;
        localStorage.clear();
        location.reload();
      }

      function cancelEdit() {
        setEditingId(null);     // stop editing
        resetForm();            // clear the edit form
        setTab('history');      // go back to History
        setToast({ t: 'Edit cancelled.', type: 'ok' });
      }

      // Jump to a tab, but first cancel any edit and close Settings.
      const goToTab = (dest) => {
        // Morning Meeting Tracker is an external MS Form — open it in the
        // user's default browser (new tab/window) instead of an in-app view.
        // The logger stays open in its own window, so returning is just a
        // matter of switching back to it.
        if (dest === "morning") {
          pauseTimer();
          window.open(MORNING_FORM_URL, "_blank", "noopener,noreferrer");
          return;                             // don't change the active tab
        }
        pauseTimer();                         // PAUSE on New Meeting/History/Prospecting switch
        if (openSettings) setOpenSettings(false);   // close Settings if open
        if (editingId) {
          setEditingId(null);
          resetForm();
          setToast({
            t: dest === 'log'
              ? 'Edit cancelled. Starting a new log.'
              : 'Edit cancelled.',
            type: 'ok'
          });
        }
        setTab(dest);
      };

      const [showAdvanced, setShowAdvanced] = useState(false);

      function DigitBox({ d }) {
        return (
          <div
            className={cls(
              "flex items-center justify-center select-none shadow-sm",
              "border border-indigo-300 bg-indigo-50 text-indigo-700 font-black tabular-nums",
              // responsive size (phone → desktop)
              "w-[clamp(3.0rem,6vw,4.4rem)] h-[clamp(3.4rem,7vw,5.2rem)]",
              "text-[clamp(1.9rem,5.5vw,3.2rem)]",
              "rounded-lg"
            )}
          >
            {d}
          </div>
        );
      }
      
      function TimerDisplay({ seconds }) {
        const mm = Math.floor(seconds / 60);
        const ss = seconds % 60;
        const [m1, m2] = String(mm).padStart(2, "0").split("");
        const [s1, s2] = String(ss).padStart(2, "0").split("");
      
        return (
          <div className="flex items-center justify-center gap-3 select-none">
            <DigitBox d={m1} />
            <DigitBox d={m2} />
            <span className="text-4xl md:text-5xl font-black text-indigo-700">:</span>
            <DigitBox d={s1} />
            <DigitBox d={s2} />
          </div>
        );
      }

      const CounterCard = ({ label, value, onPlus, onMinus }) => (
        <div className="rounded-lg border border-neutral-200 bg-white p-3 shadow-sm">
          <div className="text-center text-[13px] font-medium text-neutral-600 mb-2">{label}</div>
          <div className="flex items-center justify-between gap-3">
            <button onClick={onMinus} className="h-12 w-12 rounded-md border border-neutral-200 bg-white text-xl font-bold transition [@media(hover:hover)]:hover:bg-neutral-100 active:scale-[0.98]">–</button>
            <div className="text-5xl font-black tabular-nums select-none">{value}</div>
            <button onClick={onPlus} className="h-12 w-12 rounded-md border border-neutral-200 bg-white text-xl font-bold transition [@media(hover:hover)]:hover:bg-neutral-100 active:scale-[0.98]">+</button>
          </div>
        </div>
      );

      // Increment/decrement helpers
      const inc = (k) => setProspecting(p => ({ ...p, [k]: (p[k] || 0) + 1 }));
      const dec = (k) => setProspecting(p => ({ ...p, [k]: Math.max(0, (p[k] || 0) - 1) }));

      // Prospecting tab state
      const [prospecting, setProspecting] = useState({
        date: todayISODate(),
        approaches: 0,
        setApps: 0
      });

      // When set, the counters + Submit are editing an existing history row
      // (its entryID) instead of creating a new one. Submit re-POSTs with this
      // id so the backend upserts (overwrites) that same row. Named distinctly
      // from the meeting-log `editingId` above to avoid a redeclaration clash.
      const [editingWeekId, setEditingWeekId] = useState(null);

      // True while a prospecting submit/edit is in flight — disables the
      // Clear/Submit buttons so a user can't double-submit.
      const [prospectSubmitting, setProspectSubmitting] = useState(false);

      // Approach / Set history: this advisor's weekly prospecting rows, pulled
      // from the Sheet through the proxy. Cached so the list renders offline.
      const [prospectHistory, setProspectHistory] = useState(() => readLS(LS.prospectHistory, []));
      useEffect(() => writeLS(LS.prospectHistory, prospectHistory), [prospectHistory]);
      
      // Derived week-ending for sheet
      const weekEnding = useMemo(
        () => weekEndingSunday(prospecting.date),
        [prospecting.date]
      );

      // Prospecting submit (POSTS to /api/sync?path=prospecting)
      const handleProspectingSubmit = async () => {
        if (prospectSubmitting) return;       // guard against double-submit
        pauseTimer();                         // PAUSE on Submit
        if (!settings.advisorName) { setToast({ t:"Set your name in Settings first.", type:"warn" }); setOpenSettings(true); return; }
        if (!settings.unit)        { setToast({ t:"Select your Unit in Settings.", type:"warn" }); setOpenSettings(true); return; }
      
        const approaches = Number(prospecting.approaches) || 0;
        const setApps    = Number(prospecting.setApps)    || 0;
        if (approaches === 0 && setApps === 0) {
          setToast({ t:"Nothing to submit.", type:"warn" });
          return;
        }
      
        const record = {
          // Editing an existing week → reuse its id so the backend upserts
          // (overwrites) that row instead of appending a new one.
          id: editingWeekId || crypto.randomUUID?.() || String(Date.now()),
          kind: "prospecting",
          advisor: settings.advisorName,
          unit: settings.unit,
          weekEnding,               // your memoized Sunday
          approaches,
          setAppointments: setApps,
        };
      
        // Optimistic update: reflect the submit in the on-screen history
        // immediately (upsert by id, else advisor+week), then reconcile with the
        // server fetch below. Keeps the list feeling instant despite the slow
        // Apps Script round-trips.
        setProspectHistory(prev => {
          const arr = Array.isArray(prev) ? prev.slice() : [];
          const idx = arr.findIndex(r =>
            (record.id && r.id && r.id === record.id) ||
            (String(r.advisor || "").toLowerCase() === String(record.advisor || "").toLowerCase()
              && r.weekEnding === record.weekEnding));
          const merged = {
            ...(idx >= 0 ? arr[idx] : {}),
            id: record.id, advisor: record.advisor, unit: record.unit,
            weekEnding: record.weekEnding, approaches: record.approaches,
            setAppointments: record.setAppointments,
          };
          if (idx >= 0) arr[idx] = merged; else arr.push(merged);
          arr.sort((a, b) => String(b.weekEnding || "").localeCompare(String(a.weekEnding || "")));
          return arr;
        });

        setProspectSubmitting(true);
        try {
          // --- Option A (recommended): send key in Authorization header
          const res = await fetch(`${SYNC_URL}?path=prospecting`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${settings.syncKey || ""}`,
            },
            body: JSON.stringify(record),
          });

          if (res.status === 401) { setToast({ t: "Invalid sync key — check Settings.", type: "warn" }); return; }
          if (!res.ok)            { setToast({ t: `Proxy error (${res.status}).`, type: "warn" }); return; }

          setToast({ t: editingWeekId ? "History updated!" : "Prospecting activity submitted!", type: "ok" });
          setEditingWeekId(null);             // leave edit mode
          setProspecting(p => ({ ...p, approaches: 0, setApps: 0 }));
          pullProspectHistory();              // refresh the history below the counters

        } catch {
          // Network/CORS/offline → queue it
          setOutbox(o => [record, ...o]);
          setToast({ t: "Saved offline — will sync when online.", type: "warn" });
        } finally {
          setProspectSubmitting(false);
        }
      };

      // Load a history row back into the counters for editing. Submitting then
      // re-POSTs with the same id, so the backend overwrites that week's row.
      const startEditProspect = (row) => {
        if (!row || !row.weekEnding) {
          setToast({ t: "This entry can't be edited — try refreshing your history.", type: "warn" });
          return;
        }
        // Prefer the row's own id; otherwise the backend upserts by the week,
        // so the weekEnding itself is enough to flag that we're editing.
        setEditingWeekId(row.id || row.weekEnding);
        setProspecting(p => ({
          ...p,
          date: row.weekEnding || p.date,       // a Sunday → weekEnding stays the same
          approaches: Number(row.approaches) || 0,
          setApps: Number(row.setAppointments) || 0,
        }));
        // Jump back up to the counters so the edit is obvious.
        try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch { window.scrollTo(0, 0); }
      };

      const cancelEditProspect = () => {
        setEditingWeekId(null);
        setProspecting(p => ({ ...p, approaches: 0, setApps: 0 }));
      };

      // --- Approach / Set history -------------------------------------------
      // Pull this advisor's weekly prospecting rows through the proxy.
      // announce=true (manual Refresh) reports the outcome via a toast.
      async function pullProspectHistory(announce = false) {
        if (!settings.advisorName || !settings.syncKey) return;
        const qs = new URLSearchParams({ path: "prospectinghistory", advisor: settings.advisorName, key: settings.syncKey }).toString();
        try {
          const res = await fetch(`${SYNC_URL}?${qs}`);
          const json = await res.json().catch(() => null);
          const got = !!(json && json.ok && Array.isArray(json.rows));
          if (got) setProspectHistory(json.rows);
          if (announce) {
            if (got) {
              const n = json.rows.length;
              setToast({ t: n ? `Loaded ${n} week${n === 1 ? "" : "s"} ✅` : "No prospecting logged yet.", type: "ok" });
            } else {
              setToast({ t: "Couldn't load your history — try again shortly.", type: "warn" });
            }
          }
        } catch {
          if (announce) setToast({ t: "Couldn't reach the server (offline?).", type: "warn" });
        }
      }

      // --- Recruit / BOP guests ---------------------------------------------
      // Pull the BOP events (from the 'BOPs' tab) and this advisor's guests.
      // announce=true (manual Refresh) reports the outcome via a toast.
      async function pullBops(announce = false) {
        if (!settings.advisorName || !settings.syncKey) return;
        const qs = (p) => new URLSearchParams({ path: p, advisor: settings.advisorName, key: settings.syncKey }).toString();
        try {
          const [evRes, guRes] = await Promise.all([
            fetch(`${SYNC_URL}?${qs("bops")}`),
            fetch(`${SYNC_URL}?${qs("bopguests")}`),
          ]);
          const evJson = await evRes.json().catch(() => null);
          const guJson = await guRes.json().catch(() => null);
          const gotEvents = !!(evJson && evJson.ok && Array.isArray(evJson.events));
          if (gotEvents) setBopEvents(evJson.events);
          if (guJson && guJson.ok && Array.isArray(guJson.guests)) setBopGuests(guJson.guests);
          if (announce) {
            if (gotEvents) {
              const n = evJson.events.length;
              setToast({ t: n ? `Loaded ${n} event${n === 1 ? "" : "s"} ✅` : "No events on the list yet.", type: "ok" });
            } else {
              setToast({ t: "Couldn't load events — try again shortly.", type: "warn" });
            }
          }
        } catch {
          if (announce) setToast({ t: "Couldn't reach the server (offline?).", type: "warn" });
        }
      }

      // --- Calendar (read-only agency events) -------------------------------
      // Pull the 'Calendar' tab through the proxy. announce=true (manual
      // Refresh) reports the outcome via a toast.
      async function pullCalendar(announce = false) {
        if (!settings.advisorName || !settings.syncKey) return;
        const qs = new URLSearchParams({ path: "calendar", advisor: settings.advisorName, key: settings.syncKey }).toString();
        try {
          const res = await fetch(`${SYNC_URL}?${qs}`);
          const json = await res.json().catch(() => null);
          const got = !!(json && json.ok && Array.isArray(json.events));
          if (got) setCalEvents(json.events);
          if (announce) {
            if (got) {
              const n = json.events.length;
              setToast({ t: n ? `Loaded ${n} event${n === 1 ? "" : "s"} ✅` : "No events on the calendar yet.", type: "ok" });
            } else {
              setToast({ t: "Couldn't load the calendar — try again shortly.", type: "warn" });
            }
          }
        } catch {
          if (announce) setToast({ t: "Couldn't reach the server (offline?).", type: "warn" });
        }
      }

      // Upsert a single BOP guest row (registration/attendance) via the proxy.
      async function submitBopGuest(rec) {
        try {
          const res = await fetch(`${SYNC_URL}?path=bop`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${settings.syncKey || ""}` },
            body: JSON.stringify({ ...rec, advisor: settings.advisorName, unit: settings.unit }),
          });
          return res.ok;
        } catch { return false; }
      }

      async function registerGuest() {
        const name = (recruit.guestName || "").trim();
        if (!settings.advisorName) { setToast({ t: "Set your name in Settings first.", type: "warn" }); setOpenSettings(true); return; }
        if (!recruit.eventKey)     { setToast({ t: "Pick a BOP event first.", type: "warn" }); return; }
        if (!name)                 { setToast({ t: "Guest name is required.", type: "warn" }); return; }
        const [eventName, eventDate] = recruit.eventKey.split("||");
        const dup = bopGuests.some(g =>
          g.eventName === eventName && g.eventDate === eventDate &&
          normName(g.guestName) === normName(name));
        if (dup) { setToast({ t: `${name} is already registered for this BOP.`, type: "warn" }); return; }

        const id = crypto.randomUUID?.() || String(Date.now());
        const rec = {
          id, entryID: id, kind: "bop",
          advisor: settings.advisorName, unit: settings.unit,
          guestName: name, eventName, eventDate,
          registrationStatus: "Registered", attendance: "", remarks: "",
        };
        setBopGuests(g => [rec, ...g]);
        setRecruit(r => ({ ...r, guestName: "" }));

        const ok = await submitBopGuest(rec);
        if (!ok) { setOutbox(o => [rec, ...o]); setToast({ t: "Saved offline — will sync when online.", type: "warn" }); }
        else     { setToast({ t: `${name} registered!`, type: "ok" }); }
      }

      // Merge server records into local history by id (fallback: entryID)
      function mergeServerUpdates(updates) {
        if (!Array.isArray(updates) || updates.length === 0) return;
      
        setHistory(h => {
          // Clone so we can safely mutate matched records in place.
          const list = h.map(r => ({ ...r }));
          const byId = new Map();
          const byEntry = new Map();
          const bySig = new Map();
          for (const r of list) {
            if (r.id != null) byId.set(String(r.id), r);
            if (r.entryID) byEntry.set(String(r.entryID), r);
            if (histNorm(r.prospect)) bySig.set(histSig(r), r);
          }

          const prepend = [];   // records genuinely new to this device
          for (const u of updates) {
            // Normalize a few fields so the UI stays consistent
            if (u.firstMeeting != null && (u.firstMeeting === true || u.firstMeeting === "true")) u.firstMeeting = "Yes";
            if (u.factFinding != null && (u.factFinding === true || u.factFinding === "true")) u.factFinding = "Yes";
            if (u.appSubmitted != null && (u.appSubmitted === true || u.appSubmitted === "true")) u.appSubmitted = "Yes";
            if (u.casePaid != null && (u.casePaid === true || u.casePaid === "true")) u.casePaid = "Yes";
            if (u.caseApproved != null && (u.caseApproved === true || u.caseApproved === "true")) u.caseApproved = "Yes";

            const keyId = u.id != null ? String(u.id) : null;
            const keyEntry = (u.entryID != null && u.entryID !== "") ? String(u.entryID) : null;
            const sig = histSig(u);

            // Match by id, then server entryID, then content signature.
            const target =
              (keyId && byId.get(keyId)) ||
              (keyEntry && byEntry.get(keyEntry)) ||
              (histNorm(u.prospect) && bySig.get(sig)) ||
              null;

            if (target) {
              Object.assign(target, u);               // overwrite with admin-edited version
              if (keyId) byId.set(keyId, target);
              if (keyEntry) byEntry.set(keyEntry, target);
              if (histNorm(target.prospect)) bySig.set(histSig(target), target);
            } else {
              // Deterministic id (from content) when the server sends none, so
              // repeated pulls of the same row match instead of piling up.
              const rec = { ...u, id: keyId || ("srv:" + sig) };
              prepend.unshift(rec);                    // newest server rows on top
              byId.set(String(rec.id), rec);
              if (keyEntry) byEntry.set(keyEntry, rec);
              if (histNorm(rec.prospect)) bySig.set(sig, rec);
            }
          }
          return dedupeHistory([...prepend, ...list]);
        });
      
        // If any of the updates match outbox ids, remove them (server has them already)
        setOutbox(o => o.filter(rec => !updates.some(u => String(u.id||"") === String(rec.id||""))));
      }

      // Pull updates from server since lastSyncAt for this advisor
      async function pullUpdates() {
        if (!settings.advisorName || !settings.syncKey) return;
      
        const since = lastSyncAt || "1970-01-01T00:00:00Z";
      
        try {
          const qs = new URLSearchParams({
            since,
            advisor: settings.advisorName,
            key: settings.syncKey
          });
          const res = await fetch(`${SYNC_URL}?${qs.toString()}`);
      
          if (!res.ok) {
            setToast({ t: `Sync failed (${res.status}).`, type: "warn" });
            return;
          }
          if (res.status === 401) {
            setToast({ t: "Invalid sync key — check Settings.", type: "warn" });
            return;
          }
      
          const json = await res.json().catch(() => null);
          if (!json || json.ok !== true) {
            setToast({ t: "Sync failed (bad response).", type: "warn" });
            return;
          }
      
          const updates = Array.isArray(json.updated) ? json.updated : [];
          if (updates.length > 0) {
            mergeServerUpdates(updates);
            setToast({ t: `Pulled ${updates.length} update${updates.length > 1 ? "s" : ""} 🔄`, type: "ok" });
          } else {
            // This is the important feedback when nothing changed
            setToast({ t: "Sync: No new changes found.", type: "ok" });
          }
      
          const nowIso = new Date().toISOString();
          setLastSyncAt(nowIso);
          writeLS(LS_SYNC.last, nowIso);
        } catch (e) {
          setToast({ t: "Sync failed (offline?).", type: "warn" });
        }
      }

      // auto-open settings if needed
      useEffect(()=>{ if(!settings.advisorName || !settings.unit){ setOpenSettings(true); } },[]);

      // persist to localStorage
      useEffect(()=>writeLS(LS.settings,settings),[settings]);
      useEffect(()=>writeLS(LS.history,history),[history]);
      useEffect(()=>writeLS(LS.outbox,outbox),[outbox]);

      // keep meetingCount/firstMeeting in sync
      useEffect(()=>{ setForm(f=>({...f,meetingCount:f.firstMeeting?1:Math.max(2,Number(f.meetingCount)||2)})); },[form.firstMeeting]);
      useEffect(()=>{
        const n=Number(form.meetingCount)||0;
        if(n>1 && form.firstMeeting) setForm(f=>({...f,firstMeeting:false}));
        else if(n===1 && !form.firstMeeting) setForm(f=>({...f,firstMeeting:true}));
      },[form.meetingCount]);

      // If Paid is unchecked, clear amounts and product
      useEffect(() => {
        if (!form.casePaid) {
          setForm(f => ({ ...f, fyp: "", fyc: "", product: "" }));
        }
      }, [form.casePaid]);

      // A) Flush outbox when it changes, and when the device comes back online
      useEffect(() => {
        // inside useEffect(() => { const flushOutbox = async () => { ... } }, [outbox])
        const flushOutbox = async () => {
          if (outbox.length === 0) return;
          let sent = 0;
          const remaining = [];
        
          for (const item of outbox) {
            let ok;
            if (item && item.kind === "bop") {
              // BOP guest registration goes through the authenticated proxy.
              ok = await submitBopGuest(item);
            } else {
              // 👇 send prospecting items to the prospecting endpoint
              const target = item && item.kind === "prospecting" ? PROSPECT_URL : DEFAULT_ENDPOINT;
              ok = await sendToEndpoint(target, item);
            }
            if (ok) sent++; else remaining.push(item);
          }
        
          if (remaining.length !== outbox.length) {
            setOutbox(remaining);
            if (sent > 0) setToast({ t: `Synced ${sent} queued ${sent === 1 ? "item" : "items"} ✅`, type: "ok" });
          }
        };
      
        flushOutbox();
      
        const onOnline = () => flushOutbox();           // only flush on reconnect
        window.addEventListener("online", onOnline);
        return () => window.removeEventListener("online", onOnline);
      }, [outbox]);
      
      // B) Do one quiet pull when creds become available (first load or after typing them)
      useEffect(() => {
        if (settings.advisorName && settings.syncKey) {
          pullUpdates({ quietIfNone: true });           // no toast if there’s nothing new
        }
      }, [settings.advisorName, settings.syncKey]);

      // Big Board MTD numbers
      const [bbStats, setBbStats] = useState({ loading:false, fyc:null, cases:null, error:"" });
      const fetchBbStats = async () => {
        if (!settings.advisorName || !settings.syncKey) return;
        setBbStats(s => ({ ...s, loading:true, error:"" }));
        try {
          const url = `/api/sync?path=bigboard&advisor=${encodeURIComponent(settings.advisorName)}&key=${encodeURIComponent(settings.syncKey)}`;
          const r = await fetch(url);
          const j = await r.json().catch(()=>({}));
          if (!r.ok || j.ok === false) {
            setBbStats({ loading:false, fyc:null, cases:null, error: j.error || `HTTP ${r.status}` });
            return;
          }
          setBbStats({ loading:false, fyc:Number(j.fyc||0), cases:Number(j.cases||0), error:"" });
        } catch (e) {
          setBbStats({ loading:false, fyc:null, cases:null, error: String(e) });
        }
      };
      useEffect(() => { fetchBbStats(); }, [settings.advisorName, settings.syncKey]);
      const monthYearLabel = useMemo(() => {
        const d = new Date();
        return `${d.toLocaleString("en-US",{month:"long"})} ${d.getFullYear()} Numbers`;
      }, []);

      // Fire a one-off pull when name or key becomes valid
      useEffect(() => {
        if (settings.advisorName && settings.syncKey) {
          pullUpdates();
          pullBops();
        }
      }, [settings.advisorName, settings.syncKey]);

      // Refresh BOP events/guests each time the Recruit tab is opened.
      useEffect(() => {
        if (tab === "recruit" && settings.advisorName && settings.syncKey) pullBops();
      }, [tab]);

      // Load the agency calendar once credentials exist, and refresh it each
      // time the Calendar tab is opened.
      useEffect(() => {
        if (settings.advisorName && settings.syncKey) pullCalendar();
      }, [settings.advisorName, settings.syncKey]);
      useEffect(() => {
        if (tab === "calendar" && settings.advisorName && settings.syncKey) pullCalendar();
      }, [tab]);

      // Load the advisor's prospecting history once credentials exist, and
      // refresh it each time the Telethon tab is opened.
      useEffect(() => {
        if (settings.advisorName && settings.syncKey) pullProspectHistory();
      }, [settings.advisorName, settings.syncKey]);
      useEffect(() => {
        if (tab === "prospecting" && settings.advisorName && settings.syncKey) pullProspectHistory();
      }, [tab]);

      // scroll to top when opening settings
      useEffect(()=>{ if(openSettings){ requestAnimationFrame(()=>{ try{ window.scrollTo({top:0,behavior:"smooth"});}catch{} }); } },[openSettings]);

      const yesNoItems = useMemo(()=>[
        {key:"firstMeeting",label:"1st Meeting?"},
        {key:"factFinding",label:"KYC Done?"},
        {key:"appSubmitted",label:"Submitted?"},
        {key:"casePaid",label:"Paid?"},
        {key:"caseApproved",label:"Approved?"},
      ],[]);

      const normName = (s)=>(s||"").trim().toLowerCase();

      // Prospect matches for the typeahead: shown once 3+ letters are typed.
      // Each entry carries how many meetings are already logged for that name.
      const [showMatches,setShowMatches] = useState(false);
      const prospectMatches = useMemo(()=>{
        const q = normName(form.prospectName);
        if(q.length<3) return [];
        const byName = new Map();
        for(const r of history){
          if(r.id===editingId) continue;
          const k = normName(r.prospect);
          if(!k || !k.includes(q)) continue;
          const cur = byName.get(k) || { name:(r.prospect||"").trim(), count:0, last:null, lastStamp:"" };
          cur.count++;
          const stamp = `${r.date} ${r.appointmentTime||""}`;
          if(stamp>cur.lastStamp){ cur.lastStamp=stamp; cur.last={date:r.date, place:r.meetingPlace}; }
          byName.set(k, cur);
        }
        return [...byName.values()].sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8);
      },[history, form.prospectName, editingId]);

      function pickProspect(m){
        setForm(f=>({...f, prospectName:m.name, meetingCount:m.count+1, firstMeeting:false}));
        setShowMatches(false);
      }

      const ordinal = (n)=>{ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };

      // Past meetings already logged for the name currently typed (newest first),
      // excluding the record being edited — powers the "looks like your Nth meeting" hint.
      const priorMeetings = useMemo(()=>{
        const k = normName(form.prospectName);
        if(!k) return [];
        return history
          .filter(r=>normName(r.prospect)===k && r.id!==editingId)
          .sort((a,b)=>`${b.date} ${b.appointmentTime||""}`.localeCompare(`${a.date} ${a.appointmentTime||""}`));
      },[history, form.prospectName, editingId]);

      function recordToForm(r){
        return {
          prospectName:r.prospect||"", date:r.date||todayISODate(), time:r.appointmentTime||nowHM(),
          meetingPlace:r.meetingPlace||"Zoom",
          firstMeeting:(r.firstMeeting==="Yes"),
          meetingCount:Number(r.noOfMeetings || (r.firstMeeting==="Yes"?1:2)),
          factFinding:(r.factFinding==="Yes"),
          appSubmitted:(r.appSubmitted==="Yes"),
          casePaid:(r.casePaid==="Yes"),
          caseApproved:(r.caseApproved==="Yes"),
          referralsGiven:Number(r.referralsGiven||0),
          fyp:r.fyp??"", fyc:r.fyc??"", product:r.product||""
        };
      }
      function startEdit(rec){
        setOpenSettings(false); setEditingId(rec.id); setForm(recordToForm(rec)); setTab("log");
        setToast({ t:"Loaded for editing.", type:"ok" });
        try{ window.scrollTo({top:0,behavior:"smooth"}); }catch{}
      }

      const resetForm=()=>setForm({...emptyForm,meetingPlace:form.meetingPlace});
      const payload = useMemo(()=>{
        const dt=`${form.date} ${form.time}`;
        return {
          advisor: settings.advisorName, unit: settings.unit, prospect: form.prospectName,
          date: form.date, day: dayName(form.date), appointmentTime: form.time, meetingPlace: form.meetingPlace,
          firstMeeting: form.firstMeeting?"Yes":"No", noOfMeetings: Number(form.meetingCount)||0,
          factFinding: form.factFinding?"Yes":"No", appSubmitted: form.appSubmitted?"Yes":"No",
          casePaid: form.casePaid?"Yes":"No", referralsGiven: Number(form.referralsGiven)||0,
          fyp: form.fyp===""? "" : Number(form.fyp), fyc: form.fyc===""? "" : Number(form.fyc),
          product: form.product, caseApproved: form.caseApproved?"Yes":"No",
          timestamp: new Date().toISOString(), dt
        };
      },[form,settings]);

      const [isSending,setIsSending]=useState(false);
      const handleSubmit = async ()=>{
        if(isSending) return;
        if(!settings.advisorName){ setToast({t:"Set your name in Settings first.",type:"warn"}); setOpenSettings(true); return; }
        if(!settings.unit){ setToast({t:"Select your Unit in Settings.",type:"warn"}); setOpenSettings(true); return; }
        if(!form.prospectName){ setToast({t:"Prospect name is required.",type:"warn"}); return; }

        setIsSending(true);
        const id = editingId || (crypto.randomUUID?.() || String(Date.now()));
        const record = { id, ...payload };
        setHistory(h => editingId ? h.map(x => x.id===editingId ? record : x) : [record, ...h].slice(0,200));

        const ok = await sendToEndpoint(DEFAULT_ENDPOINT, record);
        if(!ok){ setOutbox(o=>[record,...o]); setToast({ t:"Saved offline — will sync when online.", type:"warn" }); }
        else{ setToast({ t: editingId ? "Updated!" : "Submitted!", quote:getRandomQuote(), type:"ok" }); }

        setEditingId(null); resetForm(); setIsSending(false);
      };

      const weeklyGoalSlots = useMemo(() => {
        const today = new Date();
        const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const daysSinceMonday = (monday.getDay() + 6) % 7;
        monday.setDate(monday.getDate() - daysSinceMonday);

        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        const weekStart = toLocalISO(monday);
        const weekEnd = toLocalISO(sunday);
        const paidValues = new Set(["Yes", "yes", "true", true]);

        const formatGoalTooltipDate = (iso) => {
          if (!iso) return "";
          const [year, month, day] = String(iso).split("-").map(Number);
          if (!year || !month || !day) return iso;
          return new Date(year, month - 1, day).toLocaleDateString(undefined, { month: "short", day: "numeric" });
        };

        const meetingsThisWeek = history
          .filter(r => r && r.kind !== "prospecting" && r.date >= weekStart && r.date <= weekEnd)
          .slice()
          .sort((a, b) => `${a.date || ""} ${a.appointmentTime || ""}`.localeCompare(`${b.date || ""} ${b.appointmentTime || ""}`))
          .slice(0, 15);

        return Array.from({ length: 15 }, (_, index) => {
          const meeting = meetingsThisWeek[index];
          if (!meeting) return { status: "empty" };
          return {
            status: paidValues.has(meeting.casePaid) ? "paid" : "meeting",
            tooltip: `${formatGoalTooltipDate(meeting.date)}: ${meeting.prospect || "Unnamed prospect"}`
          };
        });
      }, [history]);

      const pendingCount = outbox.length;
      const canEditAmounts = !!form.casePaid;
      
      return (
        <Page>
          <TopBar settingsOpen={openSettings} onToggleSettings={() => {
            pauseTimer();                       // PAUSE on Settings
            setOpenSettings(v => !v);
          }} pendingCount={pendingCount} weeklyGoalSlots={weeklyGoalSlots} />

          <Slide open={openSettings}>
            <Section title="SETTINGS">
              <div className="grid gap-4">
                {/* 1) Basic settings */}
                <LabeledInput label="Your Name (Advisor)">
                  <TextInput
                    value={settings.advisorName}
                    onChange={v => setSettings(s => ({ ...s, advisorName: v }))}
                    placeholder="e.g., Jimmy"
                  />
                </LabeledInput>
          
                <LabeledInput label="Unit *">
                  <Select
                    value={settings.unit}
                    onChange={v => setSettings(s => ({ ...s, unit: v }))}
                    options={UNIT_OPTIONS}
                    placeholder="-- Select Unit --"
                  />
                </LabeledInput>
          
                <LabeledInput label="Sync Key">
                  <TextInput
                    value={settings.syncKey}
                    onChange={v => setSettings(s => ({ ...s, syncKey: v }))}
                    placeholder="Paste the key from admin"
                  />
                </LabeledInput>
          
                {/* 2) Sync area */}
                <div className="rounded-lg border border-neutral-200 bg-neutral-50 p-3">
                  <div className="flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <div className="text-sm font-semibold text-neutral-700">Sync</div>
                      <div className="text-xs text-neutral-600 truncate">
                        Last sync: {lastSyncAt ? new Date(lastSyncAt).toLocaleString() : "Never"}
                      </div>
                    </div>

                  <button
                    type="button"
                    onClick={() => pullUpdates({ quietIfNone: false })}
                    disabled={!settings.advisorName || !settings.syncKey}
                    className={cls(
                      btnPrimary,
                      (!settings.advisorName || !settings.syncKey) && "opacity-50 cursor-not-allowed pointer-events-none"
                    )}
                    title={
                      !settings.advisorName || !settings.syncKey
                        ? "Enter Advisor Name and Sync Key first"
                        : "Pull admin updates now"
                    }
                  >
                    Sync now
                  </button>

                  </div>
                  {/* Advanced tools (collapsed by default) */}
                  <button
                    type="button"
                    onClick={() => setShowAdvanced(v => !v)}
                    className="mt-3 text-xs text-slate-600 underline"
                  >
                    {showAdvanced ? "Hide advanced" : "Advanced…"}
                  </button>
          
                  {showAdvanced && (
                    <div className="mt-3 grid gap-2">
                      <button
                        type="button"
                        onClick={clearHistoryAndOutbox}
                        className={btnDestructive}
                      >
                        🧹 Clear on This Phone
                      </button>
          
                      <button
                        type="button"
                        onClick={forceFullSync}
                        disabled={!settings.advisorName || !settings.syncKey}
                        className={btnSecondary}
                      >
                        🔄 Get a Fresh Copy
                      </button>

                      <button
                        type="button"
                        onClick={nukeEverything}
                        className={btnDestructive}
                      >
                         ↺ Reset App on Phone
                      </button>
          
                      <div className="mt-1 space-y-1 text-[11px] leading-snug text-slate-500">
                        <div>
                          <span className="font-semibold">🧹 Clear on This Phone </span>
                          — removes the meeting list and outbox on this device only. Your name, unit, and sync key stay saved.
                        </div>
                        <div>
                          <span className="font-semibold">🔄 Get a Fresh Copy </span>
                          — re-downloads all your entries from the server and merges them. Safe anytime (e.g., after a cleanup or new phone).
                        </div>
                        <div>
                          <span className="font-semibold">↺ Reset App on Phone </span>
                          — resets this app’s saved data on this device only. Server records stay unchanged; you’ll enter your details next time.
                        </div>
                      </div>
                    </div>
                  )}
                </div>
          
                {/* 3) Close */}
                <div className="flex justify-end">
                  <button
                    type="button"
                    className={btnSecondary}
                    onClick={() => setOpenSettings(false)}
                  >
                    Done
                  </button>
                </div>
              </div>
            </Section>
          </Slide>

          {tab==="log" && (
            <>
              <Section
                title={monthYearLabel}
                right={
                  bbStats.loading ? (
                    <span className="text-xs font-medium text-slate-500">Loading…</span>
                  ) : null
                }
              >
                {bbStats.error ? (
                  <div className="text-sm text-rose-600">Couldn't load: {bbStats.error}</div>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    <div className="rounded-md bg-neutral-100 p-3 text-center">
                      <div className="text-[11px] font-semibold uppercase tracking-wide text-neutral-500">FYC</div>
                      <div className="mt-1 text-2xl font-bold text-neutral-900">
                        {bbStats.fyc == null ? "—" : `₱${bbStats.fyc.toLocaleString("en-PH",{maximumFractionDigits:0})}`}
                      </div>
                    </div>
                    <div className="rounded-md bg-neutral-100 p-3 text-center">
                      <div className="text-[11px] font-semibold uppercase tracking-wide text-neutral-500">Cases</div>
                      <div className="mt-1 text-2xl font-bold text-neutral-900">
                        {bbStats.cases == null ? "—" : bbStats.cases}
                      </div>
                    </div>
                  </div>
                )}
              </Section>

              <Section title="Prospect">
                <LabeledInput label="Prospect Name *">
                  <div className="relative">
                    <input
                      value={form.prospectName}
                      onChange={(e)=>{ setForm(f=>({...f,prospectName:e.target.value})); setShowMatches(true); }}
                      onFocus={()=>setShowMatches(true)}
                      onBlur={()=>setTimeout(()=>setShowMatches(false),150)}
                      placeholder="e.g., Juan Dela Cruz"
                      autoComplete="off"
                      className={baseField}
                    />
                    {showMatches && prospectMatches.length>0 && (
                      <ul className="absolute z-20 mt-1 max-h-60 w-full overflow-auto rounded-md border border-neutral-200 bg-white shadow-lg">
                        {prospectMatches.map(m=>(
                          <li key={m.name}>
                            <button type="button" onMouseDown={(e)=>e.preventDefault()} onClick={()=>pickProspect(m)}
                              className="flex w-full items-center justify-between gap-3 px-3 py-2 text-left text-sm [@media(hover:hover)]:hover:bg-neutral-100">
