                                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="h-4 w-4"><path d="M20 6 9 17l-5-5"/></svg>
                                )}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              </Section>
            );
          })()}

          {tab==="calendar" && (()=>{
            // ---- date helpers (local, no timezone drift) ----
            const pad = (n) => String(n).padStart(2, "0");
            const isoOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
            const parseISO = (s) => {
              const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
              return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
            };
            const fmtLong = (iso) => {
              const d = parseISO(iso);
              return d ? d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }) : iso;
            };

            // Normalise events → { name, type, start, end, startTime, endTime, location, details }
            const agencyEvents = (calEvents || []).map(ev => {
              const start = String(ev.startDate || ev.date || "").slice(0, 10);
              const end = String(ev.endDate || start).slice(0, 10) || start;
              return {
                name: ev.eventName || ev.name || "Untitled event",
                type: calType(ev.type),
                start, end: end < start ? start : end,
                startTime: ev.startTime || "", endTime: ev.endTime || "",
                location: ev.location || "", details: ev.details || ev.remarks || "",
              };
            }).filter(e => e.start);

            // This advisor's own meetings from the Appointment 15 table (the
            // `history` records), shown in green. Prospecting rows aren't meetings.
            const myMeetings = (history || [])
              .filter(r => r && r.kind !== "prospecting" && r.date)
              .map(r => {
                const start = String(r.date || "").slice(0, 10);
                return {
                  name: r.prospect || "Meeting",
                  type: "meeting",
                  start, end: start,
                  startTime: r.appointmentTime || "", endTime: "",
                  location: r.meetingPlace || "",
                  details: [r.product, r.remarks].filter(Boolean).join(" · "),
                };
              }).filter(e => e.start);

            const events = agencyEvents.concat(myMeetings);

            // Does an event cover this ISO day? (inclusive of multi-day spans)
            const coversDay = (e, iso) => e.start <= iso && iso <= e.end;

            // Visible month grid: 6 weeks starting on Sunday.
            const [vy, vm] = calMonth.split("-").map(Number);
            const first = new Date(vy, vm - 1, 1);
            const gridStart = new Date(first);
            gridStart.setDate(1 - first.getDay());
            const todayISO = todayISODate();
            const monthLabel = first.toLocaleDateString(undefined, { month:"long", year:"numeric" });
            const shiftMonth = (delta) => {
              const d = new Date(vy, vm - 1 + delta, 1);
              setCalMonth(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
              setCalDay("");
            };

            // Minutes since midnight for a "9:00 AM" / "1:30 PM" style string, so
            // same-day events sort by real clock time rather than as text
            // (where "10:30 AM" would wrongly precede "9:00 AM"). Blank/unknown
            // times sort last within the day.
            const timeMin = (s) => {
              const m = /^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?/.exec(String(s || "").trim());
              if (!m) return 24 * 60;
              let h = +m[1] % 12;
              if (m[3] && m[3].toLowerCase() === "pm") h += 12;
              return h * 60 + (+m[2]);
            };
            // Agenda: a chosen day's events, else everything from today forward.
            const agenda = (calDay
              ? events.filter(e => coversDay(e, calDay))
              : events.filter(e => e.end >= todayISO)
            ).sort((a, b) =>
              a.start !== b.start
                ? a.start.localeCompare(b.start)
                : timeMin(a.startTime) - timeMin(b.startTime));

            // Paginate the agenda: 10 per page with Prev/Next.
            const CAL_PAGE = 10;
            const pageCount = Math.max(1, Math.ceil(agenda.length / CAL_PAGE));
            const page = Math.min(calPage, pageCount - 1);
            const pageStart = page * CAL_PAGE;
            const pagedAgenda = agenda.slice(pageStart, pageStart + CAL_PAGE);

            const cells = Array.from({ length: 42 }, (_, i) => {
              const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
              const iso = isoOf(d.getFullYear(), d.getMonth(), d.getDate());
              const dayEvents = events.filter(e => coversDay(e, iso));
              // One dot per event, grouped agency → AIA → my meetings.
              const evTypes = dayEvents.map(e => e.type)
                .sort((a, b) => (CAL_TYPE_ORDER[a] ?? 9) - (CAL_TYPE_ORDER[b] ?? 9));
              return { iso, day:d.getDate(), inMonth:d.getMonth() === vm - 1, isToday: iso===todayISO, evTypes, count:evTypes.length };
            });

            const EventCard = ({ e, i }) => {
              const t = CAL_TYPES[e.type];
              return (
                <div key={i} className="rounded-md border border-neutral-200 bg-white px-3 py-2.5 shadow-sm">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="truncate text-sm font-semibold text-neutral-900">{e.name}</div>
                      <div className="mt-0.5 text-xs text-neutral-500">
                        {fmtLong(e.start)}{e.end!==e.start ? ` – ${fmtLong(e.end)}` : ""}
                        {e.startTime ? ` · ${e.startTime}${e.endTime?`–${e.endTime}`:""}` : ""}
                      </div>
                      {e.location && <div className="text-xs text-neutral-500">{e.location}</div>}
                    </div>
                    <span className={cls("shrink-0 rounded-md border px-2 py-0.5 text-[10px] font-semibold", t.chip)}>{t.label}</span>
                  </div>
                  {e.details && <div className="mt-1.5 whitespace-pre-line text-xs text-neutral-600">{e.details}</div>}
                </div>
              );
            };

            return (
              <Section title="Agency Calendar" right={
                <button type="button" onClick={()=>pullCalendar(true)} aria-label="Refresh calendar" title="Refresh"
                  className="text-brand-600 [@media(hover:hover)]:hover:text-brand-700 active:scale-95 transition">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-4 w-4">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <path d="M21 3v6h-6" />
                  </svg>
                </button>
              }>
                {(!settings.advisorName || !settings.syncKey) ? (
                  <div className="rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-700">
                    Set your name, unit, and sync key in Settings to load the calendar.
                  </div>
                ) : (
                  <div className="grid gap-3">
                    {/* Legend */}
                    <div className="flex items-center gap-4 text-xs text-neutral-600">
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.agency.dot)} />Agency</span>
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.aia.dot)} />AIA</span>
                      <span className="flex items-center gap-1.5"><span className={cls("h-2.5 w-2.5 rounded-full", CAL_TYPES.meeting.dot)} />My Meetings</span>
                    </div>
                    <hr className="border-neutral-200" />

                    {/* Month header */}
                    <div className="flex items-center justify-between">
                      <button type="button" onClick={()=>shiftMonth(-1)} aria-label="Previous month" className={cls(btnSecondary, "h-9 w-9 px-0")}>‹</button>
                      <div className="text-sm font-semibold text-neutral-900">{monthLabel}</div>
                      <button type="button" onClick={()=>shiftMonth(1)} aria-label="Next month" className={cls(btnSecondary, "h-9 w-9 px-0")}>›</button>
                    </div>

                    {/* Month grid */}
                    <div>
                      <div className="grid grid-cols-7 text-center text-[10px] font-medium text-neutral-400">
                        {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} className="py-1">{d}</div>)}
                      </div>
                      <div className="grid grid-cols-7 gap-1">
                        {cells.map(c=>{
                          const selected = c.iso===calDay;
                          return (
                            <button key={c.iso} type="button"
                              onClick={()=>setCalDay(d=>d===c.iso?"":c.iso)}
                              className={cls(
                                "flex h-11 flex-col items-center justify-start rounded-md border pt-1 text-xs transition",
                                selected ? "border-brand-500 bg-brand-50" : "border-transparent [@media(hover:hover)]:hover:bg-neutral-50",
                                c.inMonth ? "text-neutral-800" : "text-neutral-300")}>
                              <span className={cls("flex h-5 w-5 items-center justify-center rounded-full",
                                c.isToday && "bg-ink text-white font-semibold")}>{c.day}</span>
                              <span className="mt-0.5 flex flex-col items-center gap-0.5 leading-none">
                                {[0,3].map(rowStart=>{
                                  const row = c.evTypes.slice(0,6).slice(rowStart, rowStart+3);
                                  if(!row.length) return null;
                                  return (
                                    <span key={rowStart} className="flex items-center gap-0.5">
                                      {row.map((t,idx)=><span key={idx} className={cls("h-1.5 w-1.5 rounded-full", CAL_TYPES[t].dot)} />)}
                                      {c.count>6 && rowStart===3 && (
                                        <span className="ml-0.5 text-[8px] font-semibold leading-none text-neutral-400">+{c.count-6}</span>
                                      )}
                                    </span>
                                  );
                                })}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Agenda */}
                    <hr className="border-neutral-200" />
                    <div className="grid gap-1.5">
                      <div className="flex items-center justify-between py-1.5">
                        <div className="text-xs font-semibold uppercase tracking-wide text-neutral-500">
                          {calDay ? fmtLong(calDay) : "Upcoming"}
                        </div>
                        {calDay && <button type="button" onClick={()=>setCalDay("")} className="text-xs font-medium text-brand-600 underline">Show upcoming</button>}
                      </div>
                      {agenda.length===0
                        ? <div className="text-sm text-neutral-500">{calDay ? "No events on this day." : "No upcoming events."}</div>
                        : pagedAgenda.map((e,i)=><EventCard key={pageStart+i} e={e} i={pageStart+i} />)}

                      {agenda.length > CAL_PAGE && (
                        <div className="mt-1 flex items-center justify-between">
                          <button type="button" disabled={page<=0} onClick={()=>setCalPage(p=>Math.max(0,p-1))}
                            className={cls(btnSecondary, "h-9 px-3 text-xs")}>‹ Prev</button>
                          <span className="text-xs text-neutral-500">
                            {pageStart+1}–{Math.min(pageStart+CAL_PAGE, agenda.length)} of {agenda.length}
                          </span>
                          <button type="button" disabled={page>=pageCount-1} onClick={()=>setCalPage(p=>Math.min(pageCount-1,p+1))}
                            className={cls(btnSecondary, "h-9 px-3 text-xs")}>Next ›</button>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </Section>
            );
          })()}

          <FloatingTabBar tab={tab} setTab={goToTab} />
          
          {toast && <Toast text={toast.t} quote={toast.quote} type={toast.type||"ok"} onClose={()=>setToast(null)}/>}
        </Page>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
